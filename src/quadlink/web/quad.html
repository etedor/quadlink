<!-- --ground in each scheme; a meta cannot read the tokens -->
<meta name="theme-color" content="#0a021b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f9f7ff" media="(prefers-color-scheme: light)">
<!-- a round tile, so the Q reads on light and dark browser chrome alike; the Q's nail
     is shorter than the logo's to hold up at 16px. An icon cannot read the
     page's tokens: the tile is --twitch, the Q --white -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2232%22 fill=%22%239147ff%22/%3E%3Cg fill=%22%23ffffff%22 transform=%22translate%280 -3%29%22%3E%3Cpath d=%22M39.53 12.39A21 21 0 1 1 24.47 12.39L25.55 15.19A14.65 14.65 0 1 0 38.45 15.19Z%22/%3E%3Cpath d=%22M24.5 31H39.5L37 35.5H35.4L34.3 54L32 59L29.7 54L28.6 35.5H27Z%22/%3E%3C/g%3E%3C/svg%3E">

<title>Quadlink</title>
<link rel="stylesheet" href="/web/base.css">
<style>
  html, body { height: 100%; }
  /* --cols and --grid-gap are shared by the quad and the Explore grid, so their columns line up;
     the header row is as tall as the rail's tools row, so the logo centres on the search field */
  body { --cols: 4; --grid-gap: var(--edge); --bar: calc(var(--control) + 2 * var(--edge));
    display: grid; grid-template: var(--bar) 1fr / var(--rail) 1fr; grid-template-areas: "rail top" "rail quad"; }
  /* the logo is content and starts where the quad's tiles do: 4% of the stage, never less than
     the phone's tile edge. the buttons are surfaces and end where Explore's tools do, --inset
     short of that (the header spans the stage, so % here is the stage's cqw) */
  header { grid-area: top; display: flex; align-items: center; justify-content: space-between;
    padding: 0 max(var(--edge), 4% - var(--inset)) 0 max(var(--edge) + var(--inset), 4%); }
  .logo { display: flex; align-items: center; }
  /* the wordmark's own proportions */
  .logo svg { width: 143.4px; height: 24.7px; }
  .explore-btn { padding-inline-end: var(--s4); }
  .header-tools { display: flex; gap: var(--s2); }
  aside { grid-area: rail; min-height: 0; display: flex; flex-direction: column; }
  /* field and buttons. margins, not padding, so its box is exactly the button row and its menus
     hang from that */
  .tools { display: flex; gap: var(--s2); margin-block: var(--edge); }
  aside .tools { margin-inline: var(--edge); }
  .tools .field { flex: 1; min-width: 0; }
  /* overlay scrollbars take no room and run up to 15px wide on hover; the rail's right edge has
     no gutter to lend, so it keeps --s2 clear beyond --edge */
  .rail-scroll { flex: 1; min-height: 0; overflow-y: auto; padding-right: var(--s2); }
  .stage { grid-area: quad; min-width: 0; min-height: 0; container-type: size;
    display: flex; flex-direction: column; align-items: center; overflow: hidden; }
  /* the quad's cards and Explore's share one column: card boxes sit --inset short of 4% of the
     stage, so the tiles sit on 4%, but never nearer the stage's edge than the panel does */
  .quad, .explore { --gutter: max(var(--edge), 4cqw - var(--inset)); }
  /* the quad as four cards, the size of Explore's: a live tile, then name and category, on a
     panel that pads them by --edge on every side: what is on the TV, and a surface Explore
     scrolls away beneath. its corners are concentric with the tiles' */
  .quad { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: var(--grid-gap);
    align-self: stretch; flex: none; margin: var(--edge) calc(var(--gutter) - var(--edge)) 0;
    padding: var(--edge);
    border-radius: calc(var(--r-inner) + var(--edge) + var(--inset)); background: var(--raised); }
  video { width: 100%; height: 100%; object-fit: contain; display: block; }
  /* stands in for the incoming channel until the player reaches the splice */
  .cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    background: var(--well); pointer-events: none; opacity: 0; transition: opacity 0.8s; }
  .cover.shown { opacity: 1; transition: none; }
  :where(.tile) > .inset-focus { all: unset; position: absolute; inset: 0; cursor: grab; }
  :where(.tile.armed) > .inset-focus { cursor: copy; }
  /* the rail's chips, on a scrim so they read over any video; clicks pass to the tile */
  .tile-marks { position: absolute; z-index: 1; top: var(--s2); left: var(--s2); display: flex; gap: var(--s1);
    pointer-events: none; }
  .rail { list-style: none; margin: 0; padding: 0 var(--edge) var(--edge); display: flex; flex-direction: column;
    gap: var(--s1); }
  /* one channel: a picture, then name and category. a card stacks them, a row sets them side by side */
  .item { position: relative; display: flex; flex-direction: column; gap: var(--s1); padding: var(--inset);
    border-radius: var(--r-outer); min-width: 0; }
  .item.row { flex-direction: row; align-items: center; gap: var(--edge); }
  /* the rail's one thumbnail width */
  .item.row > .thumb { flex: none; width: 96px; }
  /* 2px: the fixed line boxes already carry the leading */
  .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  /* fixed heights keep neighbours level whether or not a line carries a chip */
  .line, .sub { display: flex; align-items: center; gap: var(--s2); min-width: 0; height: var(--line); }
  .name { font-weight: 600; }
  /* the viewer count ends the name's line; the name gives way first */
  .line .viewers { margin-left: auto; font-size: var(--t-meta); }
  .lang { flex: none; color: var(--text-quiet); font-size: var(--t-meta); }
  .sub { color: var(--text-quiet); font-size: var(--t-meta); }
  .sub .cat { flex: 1; }
  /* the lock is the tile's one control on the picture, across from its marks; soft is its
     quiet middle state */
  .tile .lock { position: absolute; z-index: 2; top: var(--s2); right: var(--s2); }
  .lock.soft { color: var(--accent-ink); }
  /* .chip's display would otherwise show it on an empty tile */
  .lock[hidden] { display: none; }
  /* a pickable item is one button: drag starts on the item, a click or key on the button picks */
  .pickable { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none;
    transition: background-color var(--t-state), box-shadow var(--t-state), opacity var(--t-state); }
  .pick { position: absolute; inset: 0; margin: 0; padding: 0; border: 0; border-radius: inherit;
    background: none; cursor: grab; }
  @media (hover: hover) { .pickable:hover { background-image: linear-gradient(var(--veil), var(--veil)); } }
  /* a touch long-press, until it becomes a drag or a scroll */
  .pickable.pressing { background-image: linear-gradient(var(--veil), var(--veil)); }
  .lifted { opacity: 0.5; }
  /* every viewer count on the page: a small live dot, then the compact number */
  .viewers { flex: none; display: inline-flex; align-items: center; gap: var(--s1); color: var(--text-quiet);
    font-weight: 400; font-variant-numeric: tabular-nums; }
  .viewers:empty { display: none; }
  .viewers::before { content: ""; width: var(--s1); height: var(--s1); border-radius: var(--r-pill);
    background: var(--live); }
  :where(.btn, .chip):is([aria-pressed="true"], [aria-expanded="true"]) .viewers { color: inherit; }
  :where(.btn, .chip):is([aria-pressed="true"], [aria-expanded="true"]) .viewers::before {
    background: currentColor; }
  /* a picked row or card waits for a tile click: the click alternative to dragging */
  .picked { box-shadow: inset 0 0 0 var(--ring) var(--accent-ink); }
  /* one 16:9 picture well; a missing or loading picture shows the raised surface. only a
     tile is black, behind its video's letterboxing */
  .thumb { position: relative; display: block; aspect-ratio: 16 / 9; border-radius: var(--r-inner);
    background: var(--raised); overflow: hidden; }
  .tile { background: var(--well); }
  /* zero specificity, so the tile's .cover keeps its contain fit */
  :where(.thumb) > img { display: block; width: 100%; height: 100%; object-fit: cover; }
  /* long-press callouts would steal touch drags */
  .tile { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
  /* the Explore button switches the phone's one list; desktop shows the rail and Explore */
  @media (min-width: 721px) { .explore-btn { display: none; } }
  /* field, chip rows and card boxes on one edge, the quad's card column */
  .explore { flex: 1; min-height: 0; align-self: stretch; margin-inline: var(--gutter); display: flex;
    flex-direction: column; }
  .explore[hidden] { display: none; }
  @media (min-width: 721px) { .explore[hidden] { display: flex; } }
  /* the gaps grow so every row, the last too, is flush at both edges */
  .explore-cats { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--s1);
    padding: 0 0 var(--edge); }
  .explore-cats:empty { display: none; }
  .explore-cats .chip-row { flex-basis: 100%; display: flex; flex-wrap: wrap; justify-content: space-between;
    gap: var(--s1); min-width: 0; }
  /* the rail and Explore each scroll whole, tools and menus included. Explore fades out under the quad; it
     reaches --inset past the column so it does not clip the focus rings at the column's edges, and on
     the right across the whole gutter, so an overlay scrollbar runs in the gutter, clear of the buttons
     and cards */
  .explore-scroll { flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto;
    margin: 0 calc(-1 * var(--gutter)) 0 calc(-1 * var(--inset)); padding: 0 var(--gutter) 0 var(--inset); }
  /* the fade shows once cards sit above, as the menus' fade shows while options sit below.
     a mask, not an overlay: iOS Safari lets scrolling text show through a sticky overlay */
  :is(.explore-scroll, .rail-scroll).under {
    -webkit-mask-image: linear-gradient(var(--clear), var(--black) var(--fade));
    mask-image: linear-gradient(var(--clear), var(--black) var(--fade)); }
  /* Explore's fade starts --edge below its edge, an empty band under the quad */
  .explore-scroll.under {
    -webkit-mask-image: linear-gradient(var(--clear) var(--edge), var(--black) calc(var(--edge) + var(--fade)));
    mask-image: linear-gradient(var(--clear) var(--edge), var(--black) calc(var(--edge) + var(--fade))); }
  .cards { list-style: none; margin: 0; padding: 0 0 var(--edge); min-width: 0; display: grid; gap: var(--grid-gap);
    grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); }
  /* the title fades in at the picture's foot on hover, focus or a pick, so the grid never
     shifts; the scrim darkens only under the text */
  .peek { display: flex; position: absolute; inset: 0; align-items: flex-end; padding: var(--s2);
    box-sizing: border-box; background: var(--scrim-foot); color: var(--text); font-size: var(--t-meta);
    opacity: 0; pointer-events: none; transition: opacity var(--t-state); }
  .peek span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
    overflow-wrap: break-word; }
  .pickable:is(:has(:focus-visible), .picked) .peek { opacity: 1; }
  @media (hover: hover) { .pickable:hover .peek { opacity: 1; } }
  /* a placeholder item while its list loads; under reduced motion it holds still but stays */
  .skeleton { animation: pulse 1s infinite alternate; }
  /* about the height of the text a bar stands for */
  .skeleton .bar { width: 100%; height: 12px; border-radius: var(--r-pill); background: var(--raised); }
  .skeleton .line .bar { width: 60%; }
  .explore-end { margin: 0; padding: var(--s1) var(--inset) var(--s4); color: var(--text-quiet);
    font-size: var(--t-meta); }
  .explore-end:empty { display: none; }
  /* the drag ghost's one size, between a rail thumbnail and a card's */
  .ghost { position: fixed; z-index: 10; left: 0; top: 0; width: 144px; aspect-ratio: 16 / 9;
    border-radius: var(--r-inner); background: var(--well) center / cover no-repeat;
    pointer-events: none; opacity: 0.9; transform: translate(-50%, -50%); }
  /* a tile's drop states, set by JS for drag and pick alike: armed while a pick waits, target
     where it lands, pending until the TV takes it, failed when it did not */
  .tile::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    transition: background-color var(--t-state), box-shadow var(--t-state); }
  .tile::after, .ghost { --ring-w: var(--ring); --ring-c: var(--accent-ink); }
  .tile:is(.armed, .target, .pending, .failed)::after, .ghost {
    box-shadow: inset 0 0 0 var(--ring-w) var(--ring-c), inset 0 0 0 calc(var(--ring-w) + 2px) var(--keyline); }
  /* equal specificity throughout, so later states win by order */
  .tile:where(.armed)::after { --ring-w: 2px; }
  .tile:where(.target, .pending, .armed:has(:focus-visible))::after { --ring-w: var(--ring); background-color: var(--drop-wash); }
  @media (hover: hover) {
    .tile:where(.armed:hover)::after { --ring-w: var(--ring); background-color: var(--drop-wash); } }
  /* the wash pulses, not the ring, so pending differs from target in kind; held still, the wash stays */
  .tile:where(.pending)::after { animation: wash 1s infinite alternate; }
  .tile:where(.failed)::after { --ring-w: var(--ring); --ring-c: var(--error); background-color: var(--clear); }
  @keyframes wash { to { background-color: color-mix(in oklab, var(--drop-wash) 60%, var(--clear)); } }
  @keyframes pulse { to { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) {
    .tile.pending::after, .skeleton { animation: none; }
    .cover { transition: none; }
  }
  /* phones: top bar, the quad as 2x2 cards, then the rail or Explore */
  @media (max-width: 720px) {
    /* the narrow gap keeps the 2x2 quad short */
    body { --cols: 2; --grid-gap: var(--s1); grid-template: var(--bar) auto minmax(0, 1fr) / minmax(0, 1fr);
      grid-template-areas: "top" "quad" "rail"; }
    .stage { display: contents; }
    /* the panel is a full-bleed band; every surface below it sits on --edge */
    .quad, .explore { --gutter: var(--edge); }
    .quad { grid-area: quad; margin: 0; padding: var(--s1) var(--edge); border-radius: 0; }
    body.exploring aside { display: none; }
    .explore { grid-area: rail; }
    /* phones keep the chips to one row that scrolls sideways */
    .explore-cats { flex-wrap: nowrap; overflow-x: auto;
      -webkit-mask-image: linear-gradient(to left, var(--clear), var(--black) var(--fade));
      mask-image: linear-gradient(to left, var(--clear), var(--black) var(--fade)); }
  }
</style>

<script>
  const tiles = [...document.querySelectorAll('.tile')];

  // the relay marks every splice with a DISCONTINUITY, which hls.js counts in frag.cc;
  // the native player exposes no such hook, so its cover lifts on a timer
  const COVER_NATIVE = 7000;
  const COVER_MAX = 20000;

  function play(video, src, tile) {
    // native first: iOS Safari has HLS built in but no MSE, so hls.js can't run there
    if (video.canPlayType('application/vnd.apple.mpegurl') || !window.Hls || !Hls.isSupported()) {
      video.src = src;
      const retry = () => setTimeout(() => play(video, src, tile), 3000);
      video.addEventListener('error', retry, { once: true });
      return;
    }
    tile.hls = true;
    // low-latency HLS: hls.js holds PART-HOLD-BACK behind the live edge, as the TV does
    const hls = new Hls({ lowLatencyMode: true });
    hls.on(Hls.Events.FRAG_CHANGED, (_, { frag }) => {
      if (tile.cc !== undefined && frag.cc !== tile.cc && tile.awaiting) uncover(tile);
      tile.cc = frag.cc;
    });
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (!data.fatal) return;
      hls.destroy();
      tile.cc = undefined;
      setTimeout(() => play(video, src, tile), 3000);
    });
    hls.loadSource(src);
    hls.attachMedia(video);
  }

  // a slot the server changed (selection, an unpin) shows the incoming channel's
  // thumbnail until its video plays, like a drop does
  function coverChanges(before) {
    tiles.forEach((tile, i) => {
      const channel = latest.slots[i]?.channel;
      if (!channel || channel === before.slots[i]?.channel || tile.awaiting) return;
      cover(tile, thumb(channel));
    });
  }

  // Twitch refreshes previews every few minutes; the bucket keeps the browser cache in step,
  // and the rail, Explore and covers show the same still
  const preview = url => url ? url + '?t=' + Math.floor(Date.now() / 300000) : null;
  const thumb = channel => preview(latest?.channels.find(x => x.channel === channel)?.thumbnail);

  function cover(tile, image) {
    const img = tile.querySelector('.cover');
    clearTimeout(tile.coverTimer);
    if (image) img.src = image; else img.removeAttribute('src');
    img.classList.add('shown');
    tile.awaiting = true;
    tile.coverTimer = setTimeout(() => uncover(tile), tile.hls ? COVER_MAX : COVER_NATIVE);
  }

  function uncover(tile) {
    clearTimeout(tile.coverTimer);
    tile.awaiting = false;
    tile.querySelector('.cover').classList.remove('shown');
    settle(tiles.indexOf(tile));
  }

  // the current frame as an image; the relay is same-origin, so the canvas stays readable
  function frame(tile) {
    const video = tile.querySelector('video');
    if (!video.videoWidth) return null;
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);

  const viewerCompact = new Intl.NumberFormat('en', { notation: 'compact', maximumSignificantDigits: 2 });

    priority: (a, b) => (b.priority ?? -Infinity) - (a.priority ?? -Infinity),
    viewers: (a, b) => (b.viewers ?? -1) - (a.viewers ?? -1),

    newest: (a, b) => (b.started_at ?? -Infinity) - (a.started_at ?? -Infinity),

      .filter(c => !c.extra && c.slot == null)

  // an empty field lets Escape through to close the next layer

    });

  const DRAG_DISTANCE = 6;
  const LONG_PRESS = 300;

  let dragged = false;

  async function act(body) {
    const resp = await fetch('/api/actions', {

      body: JSON.stringify(body),
    });

  }

  function expect(slot) {
    tiles[slot].classList.remove('failed');
    tiles[slot].classList.add('pending');
  }

  function settle(slot, failed = false) {

  function sourceEl(source) {

  }
  function sourceImage(source) {

  }

  tiles.forEach((tile, slot) => tile.addEventListener('pointerdown', e => armDrag(e, { slot })));

  const token = document.querySelector('meta[name="quadlink-token"]').content;

  // Explore: browse a Twitch category for streams the config does not know
  const exploreBtn = document.querySelector('.explore-btn');
  const exploreQ = document.getElementById('explore-q');
  const cats = explore.querySelector('.explore-cats');
  const cards = explore.querySelector('.cards');
  const endNote = explore.querySelector('.explore-end');
  const exFilterBtn = explore.querySelector('.ex-filter-btn');
  const exSortBtn = explore.querySelector('.ex-sort-btn');

  try {
    const saved = JSON.parse(localStorage.getItem('quadlink.explore.2') || '{}');

  } catch {}
  function saveExplore() {

  }

  async function getJSON(path) {
    const resp = await fetch(path, { headers: { 'X-Quadlink-Token': token } });
    const body = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(body.error || resp.statusText);

  }

  const here = () => ({ quad: 1, exploring: exploring(), category: ex.category, q: exploreQ.value,

  function categoryChip(c) {
    const b = document.createElement('button');

    return b;
  }

    ex.searching = false;

  }

  async function chooseNamed(name) {
    clearTimeout(ex.searchTimer);

  function unchoose() {
    ex.category = null;
    ex.searching = false;
    exploreQ.value = '';
    showCats();
    loadStreams();
  }

  // shows the chips that fill CHIP_ROWS rows at this width; the chosen one always shows
  function fitRows() {
    // measured as one wrapping line, the way the browser first lays the chips out
    cats.querySelectorAll('.chip-row').forEach(row => row.replaceWith(...row.children));
    const chips = [...cats.querySelectorAll('.chip')];
    chips.forEach(c => { c.style.display = ''; });
    const tops = [...new Set(chips.map(c => c.offsetTop))];
    if (tops.length <= CHIP_ROWS) {
      if (tops.length > 1) balance(chips, tops.length);
      return;
    }
    const last = tops[CHIP_ROWS - 1];
    const extra = chips.filter(c => c.offsetTop > last);
    const chosen = extra.find(c => c.getAttribute('aria-pressed') === 'true');
    if (chosen) {
      cats.prepend(chosen);
      fitRows();
      return;
    }
    extra.forEach(c => { c.style.display = 'none'; });
  }
  addEventListener('resize', () => { if (exploring()) fitRows(); });

  // splits the chips into rows of about equal width, so no row ends with a stray pair
  function balance(chips, rows) {
    const widths = chips.map(c => c.offsetWidth);
    const total = widths.reduce((a, b) => a + b, 0);
    const lines = [[]];
    let done = 0;
    chips.forEach((chip, i) => {
      // a chip starts the next row once its middle passes this row's share
      const share = (total * lines.length) / rows;
      if (lines.length < rows && lines.at(-1).length && done + widths[i] / 2 > share) lines.push([]);
      lines.at(-1).push(chip);
      done += widths[i];
    });
    cats.replaceChildren(...lines.map(line => {
      const row = document.createElement('div');
      row.className = 'chip-row';
      row.append(...line);
      return row;
    }));
  }

  function markChips() {
    cats.querySelectorAll('.chip').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.id === ex.category?.id)));
  }

  // only the newest request of each kind counts. a failure (a restart, Twitch, the proxy)
  // says nothing: what is shown stays, and again() asks once more while Explore is open.
  // resolves to apply's result, or null for a stale or failed request
  const requests = { cats: 0, found: 0, streams: 0 };
  async function retrying(kind, path, apply, again, failed = () => {}) {
    const n = ++requests[kind];
    try {
      const body = await getJSON(path);
      if (n === requests[kind]) return apply(body);
    } catch {
      if (n !== requests[kind]) return null;
      failed();
      setTimeout(() => { if (exploring() && n === requests[kind]) again(); }, RETRY_AFTER);
    }
    return null;
  }

  // the search's results, else Twitch's top categories; resolves to what it listed
  function showCats() {
    const q = exploreQ.value.trim();
    return retrying('cats', '/api/explore/categories?q=' + encodeURIComponent(q), body => {
      cats.replaceChildren(...body.categories.map(categoryChip));
      if (body.categories.length) fitRows();
      return body.categories;
    }, showCats);
  }

  // live channels whose name matches the search, ahead of the listing
  async function showFound() {
    const q = exploreQ.value.trim();
    if (!q) {
      requests.found++;
      ex.found = [];
      showStreams();
      return;
    }
    await retrying('found', '/api/explore/channels?q=' + encodeURIComponent(q), body => {
      ex.found = body.streams;
      showStreams();
    }, showFound, () => {
      // the cards stand for another search until the retry answers
      if (ex.searching) placeholders();
    });
  }
  exploreQ.addEventListener('input', () => {
    ex.searching = true;
    clearTimeout(ex.searchTimer);
    ex.searchTimer = setTimeout(() => searched(true), SEARCH_AFTER);
  });
  exploreQ.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    clearTimeout(ex.searchTimer);
    searched().then(chooseExact);
  });
  clearable(exploreQ, () => searched());

  // Enter takes only an exact name: a channel, picked for a tile, before a category
  function chooseExact() {
    const q = exploreQ.value.trim().toLowerCase();
    if (!q) return;
    const s = ex.found.find(x => x.channel === q || x.display_name.toLowerCase() === q);
    if (s) { pick(s.channel); return; }
    [...cats.querySelectorAll('.chip')].find(b => b.dataset.name.toLowerCase() === q)?.click();
  }

  // the search persists until cleared; clearing it ends a choice the top categories do not hold
  async function searched(typing = false) {
    remember(typing);
    const [found] = await Promise.all([showCats(), showFound()]);
    if (!exploreQ.value.trim() && found && ex.category && !found.some(c => c.id === ex.category.id)) {
      unchoose();
      remember(typing);
    }
  }

  // quiet: a refresh of what is shown, so the grid keeps its place and shows no placeholders
  function loadStreams(quiet = false) {
    const id = ex.category?.id ?? '';
    if (!quiet) {
      ex.listing = null;
      placeholders();
      scroller.scrollTop = 0;
      scroller.classList.remove('under');
    }
    return retrying('streams', `/api/explore/streams?category=${id}&sort=${ex.sort}&language=${ex.lang}`, listing => {
      ex.listing = listing;
      if (ex.category && listing.category) ex.category.viewers = listing.category.viewers;
      showStreams();
    }, () => loadStreams(quiet));
  }

  function placeholders() {
    cards.replaceChildren(...Array.from({ length: 2 * columns() }, () => skeleton('card')));
    endNote.textContent = '';
  }

  // a typed search shows the channels it found, if any; a chosen category, its listing
  function showStreams() {
    if (ex.searching && ex.found.length) {
      cards.replaceChildren(...ex.found.map(card));
      endNote.textContent = '';
      return;
    }
    // found cards from an earlier search must not stay while the listing loads
    if (!ex.listing) { placeholders(); return; }
    const { streams, more, category } = ex.listing;
    // a top-N cut ends on a full row
    const shown = more ? streams.slice(0, streams.length - (streams.length % columns())) : streams;
    cards.replaceChildren(...shown.map(card));
    // the grid's end needs no words; only an empty grid gets a line
    endNote.textContent = streams.length ? '' : `No one is live${category ? ' in ' + category.name : ''}.`;
  }

  // Twitch knows a stream's language, not its country: each language shows the flag of
  // the country most of its Twitch streams come from, and the viewer's own language their
  // own country's. Windows draws no flag emoji, so it keeps the code
  const FLAG_COUNTRY = { EN: 'US', ES: 'ES', PT: 'BR', DE: 'DE', FR: 'FR', IT: 'IT', JA: 'JP',
    KO: 'KR', ZH: 'TW', RU: 'RU', PL: 'PL', TR: 'TR', NL: 'NL', SV: 'SE', NO: 'NO', DA: 'DK',
    FI: 'FI', CS: 'CZ', SK: 'SK', HU: 'HU', EL: 'GR', UK: 'UA', RO: 'RO', BG: 'BG', TH: 'TH',
    VI: 'VN', ID: 'ID', MS: 'MY', TL: 'PH', HI: 'IN' };
  const LANGS = [...Object.keys(FLAG_COUNTRY), 'AR', 'CA', 'ASL', 'OTHER'];
  const own = (() => { try { return new Intl.Locale(navigator.language).maximize(); } catch { return null; } })();
  const drawsFlags = !/Windows/.test(navigator.userAgent);

  function flag(code) {
    const country = own && code.toLowerCase() === own.language && own.region ? own.region : FLAG_COUNTRY[code];
    if (!drawsFlags || !country) return null;
    return String.fromCodePoint(...[...country].map(ch => 0x1f1e6 + ch.charCodeAt(0) - 65));
  }

  function languageName(code) {
    if (code === 'ASL') return 'Sign language';
    if (code === 'OTHER') return 'Other';
    try { return new Intl.DisplayNames([navigator.language], { type: 'language' }).of(code.toLowerCase()); } catch { return code; }
  }

  // the default: the viewer's own language when Twitch has it, else all
  function ownLang() {
    const code = own?.language.toUpperCase();
    return LANGS.includes(code) ? code : '';
  }
  if (ex.lang === null) ex.lang = ownLang();

  function langChoices() {
    const ownCode = ownLang();
    const label = code => [flag(code), languageName(code)].filter(Boolean).join(' ');
    const rest = LANGS.filter(c => c !== ownCode).sort((a, b) => languageName(a).localeCompare(languageName(b)));
    return [['', 'All languages'], ...(ownCode ? [[ownCode, label(ownCode)]] : []),
      ...rest.map(c => [c, label(c)])];
  }
  const exApply = () => { saveExplore(); loadStreams(); };
  menu({ button: exFilterBtn, title: 'Language', reset: 'Reset language', apply: exApply,
    groups: [{ type: 'radio', name: 'ex-lang', choices: langChoices, fallback: ownLang(),
      get: () => ex.lang, set: v => { ex.lang = v; } }] });
  menu({ button: exSortBtn, title: 'Sort by', reset: 'Reset sort', apply: exApply,
    groups: [{ type: 'radio', name: 'ex-sort', choices: () => EX_SORTS, fallback: 'viewers',
      get: () => ex.sort, set: v => { ex.sort = v; } }] });

  // safe edits only: Twitch shows titles as typed, so case stays, and a !command stays
  // unless it is part of the run that ends the title. ©®™ are pictographic but not emoji
  const TITLE_SEPS = '|•·~\\-–—/║';
  const TITLE_EMOJI = /(?![©®™])[\p{Extended_Pictographic}\p{Emoji_Modifier}\p{Regional_Indicator}\u200D\uFE0F\u20E3]/gu;
  const TITLE_COMMANDS = new RegExp(`(?:(?:^|[\\s${TITLE_SEPS}]+)![\\p{L}\\p{N}_-]+)+[\\s${TITLE_SEPS}]*$`, 'u');
  const TITLE_REPEATS = new RegExp(`\\s*([${TITLE_SEPS}])(?:\\s*[${TITLE_SEPS}])+\\s*`, 'gu');
  function streamTitle(text) {
    return (text || '')
      .replace(TITLE_EMOJI, ' ')
      .replace(TITLE_COMMANDS, '')
      .replace(TITLE_REPEATS, ' $1 ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  const card = s => item(s, { image: preview(s.thumbnail), title: streamTitle(s.title) });

  // a reload or a link opens the default view; back or forward from another page returns
  // to the entry's own
  if (performance.getEntriesByType('navigation')[0]?.type === 'back_forward' && history.state?.quad) {
    restore(history.state);
  } else if (!phone.matches) {
    setExploring(true);
  }
  try { history.replaceState(here(), '', location.pathname); } catch {}
  phone.addEventListener('change', () => {
    retitle();
    if (phone.matches) return;
    setExploring(true);
    try { history.replaceState(here(), ''); } catch {}
  });

  // placeholder rows until the first snapshot
  rail.replaceChildren(...Array.from({ length: ROW_SKELETONS }, () => skeleton('row')));
  const events = new EventSource('/api/events?token=' + encodeURIComponent(token));
  events.onmessage = e => {
    const before = latest;
    latest = JSON.parse(e.data);
    render();
    markTiles();
    if (before) coverChanges(before);
  };
  // a restart changes the page token, and EventSource never retries a refusal
  events.onerror = () => { if (events.readyState === EventSource.CLOSED) setTimeout(() => location.reload(), 5000); };
</script>
</body>
</html>
