<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="quadlink-token" content="__QUADLINK_TOKEN__">
<title>quadlink · quad</title>
<style>
  /* one corner radius for every rounded surface; nested corners subtract their inset.
     every color is a token here, and every purple is mixed from --twitch */
  :root {
    --radius: 17px;
    --twitch: #9147ff;
    --black: #000;
    --white: #fff;
    --clear: transparent;
    --ground: color-mix(in oklab, var(--twitch) 22%, var(--black));
    --hover: color-mix(in oklab, var(--twitch) 36%, var(--black));
    --current: color-mix(in oklab, var(--twitch) 29%, var(--black));
    --well: var(--black);
    --scrim: color-mix(in oklab, var(--black) 65%, var(--clear));
    --text: color-mix(in oklab, var(--twitch) 6%, var(--white));
    --text-quiet: color-mix(in oklab, var(--twitch) 35%, var(--white));
    --accent: var(--twitch);
    --field: color-mix(in oklab, var(--twitch) 30%, var(--black));
    --popover: color-mix(in oklab, var(--twitch) 32%, var(--black));
    --live: #eb0400;
    --error: var(--live);
  }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--text); }
  body { display: grid; grid-template: 58px 1fr / 312px 1fr; grid-template-areas: "rail top" "rail quad"; }
  header { grid-area: top; display: flex; align-items: center; justify-content: flex-end;
    padding: 0 19px; font: 16px system-ui, sans-serif; }
  /* temporary: clears every pin and bench */
  .reset-all { height: 34px; padding: 0 14px; border: 0; border-radius: calc(var(--radius) - 7px);
    background: var(--field); color: var(--text); font: inherit; cursor: pointer; }
  .reset-all:hover { background: var(--hover); }
  aside { grid-area: rail; min-height: 0; display: flex; flex-direction: column;
    font: 16px system-ui, sans-serif; position: relative; }
  .tools { display: flex; gap: 7px; padding: 10px 10px 5px; }
  .tools input { flex: 1; min-width: 0; height: 38px; box-sizing: border-box; padding: 0 12px;
    border: 0; border-radius: calc(var(--radius) - 7px); background: var(--field);
    color: var(--text); font: inherit; outline-offset: 0; }
  .tools input::placeholder { color: var(--text-quiet); }
  .tools button { position: relative; flex: none; width: 38px; height: 38px; border: 0;
    border-radius: calc(var(--radius) - 7px); background: var(--field); color: var(--text);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .tools button:hover, .tools button[aria-expanded="true"] { background: var(--hover); }
  /* a dot on a glyph says its choices differ from the defaults */
  .tools button.changed::after { content: ""; position: absolute; top: 6px; right: 6px;
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  /* the gutter keeps room for the scrollbar even when it shows, so the reset glyph
     at the row's right end never sits under it */
  .pop { position: absolute; top: 53px; left: 10px; right: 10px; z-index: 1;
    border-radius: var(--radius); background: var(--popover); max-height: 60vh;
    overflow-y: auto; scrollbar-gutter: stable; }
  .pop-head { display: flex; align-items: center; justify-content: space-between;
    padding: 7px 7px 0 12px; color: var(--text-quiet); font-size: 14px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap; }
  .pop-body { padding: 0 12px 7px; }
  .pop fieldset:last-child { margin-bottom: 0; }
  /* the fade shows only while more options sit below, so the menu ends at its last item */
  .pop.more::after { content: ""; position: sticky; bottom: 0; display: block; height: 38px;
    margin-top: -32px; pointer-events: none;
    background: linear-gradient(var(--clear), var(--popover)); }
  .pop .reset { width: 34px; height: 34px; border: 0; padding: 0;
    border-radius: calc(var(--radius) - 7px); background: none; color: var(--text-quiet);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .pop .reset:hover { background: var(--hover); color: var(--text); }
  /* fieldsets default to min-content width, which would let long names push past the edge */
  .pop fieldset { border: 0; margin: 0 0 10px; padding: 0; min-width: 0; }
  .pop legend { color: var(--text-quiet); font-size: 14px; margin-bottom: 5px; padding: 0; }
  .pop label { display: flex; align-items: center; gap: 10px; padding: 5px 2px; cursor: pointer;
    min-width: 0; }
  .pop label span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pop input { accent-color: var(--accent); }
  .rail-scroll { flex: 1; min-height: 0; overflow-y: auto; }
  .stage { grid-area: quad; min-width: 0; min-height: 0; container-type: size;
    display: flex; align-items: flex-start; justify-content: center; }
  /* the whole quad is 16:9, so each 16:9 stream fills its tile uncropped and the
     tiles touch. it takes 92% of the stage width when the height allows, and sits
     as far below the top bar as it is in from the sides (never past the bottom) */
  .quad { --w: min(92cqw, (100cqh - 8cqw) * 16 / 9);
    display: grid; grid-template: 1fr 1fr / 1fr 1fr;
    width: var(--w); aspect-ratio: 16 / 9;
    margin-top: min((100cqw - var(--w)) / 2, 100cqh - var(--w) * 9 / 16);
    border-radius: var(--radius); overflow: hidden; }
  .tile { position: relative; background: var(--well); overflow: hidden; }
  .tile.loud::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 2px var(--accent); }
  video { width: 100%; height: 100%; object-fit: contain; display: block; }
  /* stands in for the incoming channel until the player reaches the splice */
  .cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    background: var(--well); pointer-events: none; opacity: 0; transition: opacity 0.4s; }
  .cover.shown { opacity: 1; transition: none; }
  .tile button { all: unset; position: absolute; inset: 0; cursor: pointer; }
  .tile button:focus-visible { outline: 3px solid var(--text); outline-offset: -3px; }
  body.picking .tile button { cursor: copy; }
  body.picking .tile:hover::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 3px var(--accent); }
  /* pin and sound marks sit on a scrim, so they read over any video */
  .tile-marks { position: absolute; top: 10px; left: 10px; display: flex; gap: 5px;
    pointer-events: none; }
  .tile-marks span { display: inline-flex; padding: 5px; border-radius: calc(var(--radius) - 10px);
    background: var(--scrim); color: var(--text); }
  .tile-marks .pin { color: var(--accent); }
  .rail { list-style: none; margin: 0; padding: 5px 10px 10px; display: flex; flex-direction: column;
    gap: 5px; }
  .rail li { display: flex; align-items: center; gap: 12px; padding: 7px; border-radius: var(--radius); }
  .rail li.in { background: var(--current); }
  .rail li:hover { background: var(--hover); }
  .rail img { flex: none; width: 96px; aspect-ratio: 16 / 9; border-radius: calc(var(--radius) - 7px);
    background: var(--well);
    object-fit: cover; }
  .rail .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .rail .name, .rail .cat { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rail .name { font-weight: 600; }
  /* override glyphs follow the name; the name gives way first */
  .rail .line { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .rail .marks { flex: none; display: inline-flex; gap: 5px; color: var(--text-quiet); }
  .rail .marks .pin { color: var(--accent); }
  /* WCAG 2.5.8: a 29px hit area around a 16px glyph */
  .rail .undo { all: unset; display: inline-flex; align-items: center; justify-content: center;
    width: 29px; height: 29px; margin: -6px -4px; border-radius: 50%; cursor: pointer; }
  .rail .undo:hover { background: var(--popover); }
  .rail .undo:focus-visible { outline: 2px solid var(--text); }
  /* hover previews the result: the glyph gets struck through */
  .rail .undo .off, .rail .undo:hover .on, .rail .undo:focus-visible .on { display: none; }
  .rail .undo:hover .off, .rail .undo:focus-visible .off { display: inline-flex; }
  /* WCAG 1.4.1: a state needs more than color, and the in-quad tint is only 1.05:1 */
  .rail .slot { display: inline-flex; align-items: center; justify-content: center;
    min-width: 19px; height: 19px; padding: 0 3px; box-sizing: border-box;
    border: 1.5px solid var(--accent); border-radius: calc(var(--radius) - 11px);
    color: var(--text); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .rail li:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; }
  /* a picked row waits for a tile click: the click alternative to dragging */
  .rail li.picked { box-shadow: inset 0 0 0 2px var(--accent); }
  .rail li.benched > img, .rail li.benched .line .name { opacity: 0.55; }
  /* category and viewer count share the second line; the category gives way first */
  .rail .meta { display: flex; align-items: center; gap: 10px; color: var(--text-quiet); font-size: 14px; }
  .rail .cat { flex: 1; min-width: 0; }
  .rail .viewers { flex: none; display: inline-flex; align-items: center; gap: 5px;
    color: var(--text); font-variant-numeric: tabular-nums; }
  .rail .viewers::before { content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--live); }
  /* drag: rows and tiles can be picked up; long-press callouts would steal touch drags */
  .rail li, .tile { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
  .rail li { cursor: grab; }
  .rail img { pointer-events: none; }
  .ghost { position: fixed; z-index: 10; left: 0; top: 0; width: 144px; aspect-ratio: 16 / 9;
    border-radius: calc(var(--radius) - 7px); background: var(--well) center / cover no-repeat;
    box-shadow: 0 0 0 2px var(--accent); pointer-events: none; opacity: 0.9;
    transform: translate(-50%, -50%); }
  .tile.target::after, .tile.pending::after, .tile.failed::after { content: ""; position: absolute;
    inset: 0; pointer-events: none; }
  .tile.target::after { box-shadow: inset 0 0 0 3px var(--accent); }
  .tile.pending::after { box-shadow: inset 0 0 0 3px var(--accent); animation: pulse 1s infinite alternate; }
  .tile.failed::after { box-shadow: inset 0 0 0 3px var(--error); }
  .tile.lifted { opacity: 0.5; }
  @keyframes pulse { to { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) {
    .tile.pending::after { animation: none; }
    .cover { transition: none; }
  }
  /* phones: top bar, a short quad, then the list. the quad fills the width at a fixed
     height, so tiles crop their streams instead of keeping 16:9 */
  @media (max-width: 720px) {
    body { grid-template: 58px 32svh 1fr / 1fr; grid-template-areas: "top" "quad" "rail"; }
    .stage { container-type: normal; padding: 0 19px; }
    .quad { width: 100%; height: 100%; aspect-ratio: auto; margin: 0; }
    video, .cover { object-fit: cover; }
    aside { padding-top: 10px; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
</head>
<body>
<header><button type="button" class="reset-all">Reset pins &amp; benches</button></header>
<aside aria-label="Online streamers">
  <div class="tools">
    <input type="search" placeholder="Search…" aria-label="Search channels">
    <button type="button" class="filter-btn" aria-label="Filter" aria-expanded="false"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"></path></svg></button>
    <button type="button" class="sort-btn" aria-label="Sort" aria-expanded="false"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"></path></svg></button>
  </div>
  <div class="pop filter-pop" hidden>
    <div class="pop-head"><span aria-hidden="true">Show</span><button type="button" class="reset" aria-label="Reset filters" title="Reset"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg></button></div>
    <div class="pop-body">
      <fieldset class="show"><legend class="sr-only">Show</legend></fieldset>
      <fieldset class="cats"><legend>Category</legend></fieldset>
    </div>
  </div>
  <div class="pop sort-pop" hidden>
    <div class="pop-head"><span aria-hidden="true">Sort by</span><button type="button" class="reset" aria-label="Reset sort" title="Reset"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg></button></div>
    <div class="pop-body"><fieldset class="sorts"><legend class="sr-only">Sort by</legend></fieldset></div>
  </div>
  <div class="rail-scroll"><ul class="rail"></ul></div>
</aside>
<main class="stage">
<div class="quad">
  <div class="tile">
    <video muted autoplay playsinline></video>
    <img class="cover" alt="">
    <div class="tile-marks"></div>
    <button aria-label="Slot 1" aria-pressed="false"></button>
  </div>
  <div class="tile">
    <video muted autoplay playsinline></video>
    <img class="cover" alt="">
    <div class="tile-marks"></div>
    <button aria-label="Slot 2" aria-pressed="false"></button>
  </div>
  <div class="tile">
    <video muted autoplay playsinline></video>
    <img class="cover" alt="">
    <div class="tile-marks"></div>
    <button aria-label="Slot 3" aria-pressed="false"></button>
  </div>
  <div class="tile">
    <video muted autoplay playsinline></video>
    <img class="cover" alt="">
    <div class="tile-marks"></div>
    <button aria-label="Slot 4" aria-pressed="false"></button>
  </div>
</div>
</main>
<script>
  const tiles = [...document.querySelectorAll('.tile')];

  // the relay marks every splice with a DISCONTINUITY, which hls.js counts in frag.cc;
  // the native player exposes no such hook, so its cover lifts on a timer
  const COVER_NATIVE = 7000;
  const COVER_MAX = 20000;

  function play(video, src, tile) {
    // native first: iOS Safari has HLS built in but no MSE, so hls.js can't run there
    if (video.canPlayType('application/vnd.apple.mpegurl') || !window.Hls || !Hls.isSupported()) {
      video.src = src;
      const retry = () => setTimeout(() => play(video, src, tile), 3000);
      video.addEventListener('error', retry, { once: true });
      return;
    }
    tile.hls = true;
    const hls = new Hls({ liveSyncDurationCount: 2 });
    hls.on(Hls.Events.FRAG_CHANGED, (_, { frag }) => {
      if (tile.cc !== undefined && frag.cc !== tile.cc && tile.awaiting) uncover(tile);
      tile.cc = frag.cc;
    });
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (!data.fatal) return;
      hls.destroy();
      tile.cc = undefined;
      setTimeout(() => play(video, src, tile), 3000);
    });
    hls.loadSource(src);
    hls.attachMedia(video);
  }

  function cover(tile, image) {
    const img = tile.querySelector('.cover');
    clearTimeout(tile.coverTimer);
    if (image) img.src = image; else img.removeAttribute('src');
    img.classList.add('shown');
    tile.awaiting = true;
    tile.coverTimer = setTimeout(() => uncover(tile), tile.hls ? COVER_MAX : COVER_NATIVE);
  }

  function uncover(tile) {
    clearTimeout(tile.coverTimer);
    tile.awaiting = false;
    tile.querySelector('.cover').classList.remove('shown');
    settle(tiles.indexOf(tile));
  }

  // the current frame as an image; the relay is same-origin, so the canvas stays readable
  function frame(tile) {
    const video = tile.querySelector('video');
    if (!video.videoWidth) return null;
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    return canvas.toDataURL('image/jpeg', 0.8);
  }

  tiles.forEach((tile, i) => {
    const video = tile.querySelector('video');
    play(video, '/streams/' + (i + 1), tile);
    // one tile has sound at a time; click the loud one again to mute it. with a row
    // picked, the click places that channel instead
    tile.querySelector('button').addEventListener('click', () => {
      if (picked) {
        const li = rail.querySelector(`li[data-channel="${CSS.escape(picked)}"]`);
        place(i, picked, li?.querySelector('img')?.src || null);
        pick(null);
        return;
      }
      const loud = !tile.classList.contains('loud');
      tiles.forEach(t => { t.classList.remove('loud'); t.querySelector('video').muted = true; });
      if (loud) { tile.classList.add('loud'); video.muted = false; video.play(); }
      markTiles();
    });
  });

  const rail = document.querySelector('.rail');
  const compact = new Intl.NumberFormat(undefined, { notation: 'compact', maximumFractionDigits: 1 });
  const STATES = [['live', 'Live'], ['waiting', 'Waiting'], ['benched', 'Benched'],
                  ['in quad', 'In quad'], ['offline', 'Offline']];
  const SORTS = [['priority', 'Priority'], ['viewers', 'Viewers'], ['name', 'Name'],
                 ['newest', 'Newest stream'], ['longest', 'Longest stream']];
  const DEFAULTS = { show: ['in quad', 'live', 'waiting', 'benched'], cats: [], sort: 'priority' };
  let view = { ...DEFAULTS, q: '' };
  try { Object.assign(view, JSON.parse(localStorage.getItem('quadlink.view.2') || '{}'), { q: '' }); } catch {}
  let latest = null;

  function save() {
    try { localStorage.setItem('quadlink.view.2', JSON.stringify({ show: view.show, cats: view.cats, sort: view.sort })); } catch {}
  }

  const PIN = '<path d="M12 17v5"/><path d="M9 10.76V6h6v4.76l2 3.24H7z"/><path d="M8 6h8"/>';
  const BENCH = '<path d="M5 7h14"/><path d="M3 12h18"/><path d="M7 7v5M17 7v5"/><path d="M6 12v6M18 12v6"/>';

  function glyph(kind, paths, label) {
    const span = document.createElement('span');
    span.className = kind;
    span.title = label;
    span.setAttribute('role', 'img');
    span.setAttribute('aria-label', label);
    span.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
      + 'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>';
    return span;
  }

  const SPEAKER = '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>'
    + '<path d="M18.5 5.5a9 9 0 0 1 0 13"/>';
  let picked = null;

  function pick(channel) {
    picked = channel && channel !== picked ? channel : null;
    document.body.classList.toggle('picking', picked !== null);
    rail.querySelectorAll('li').forEach(li => {
      li.classList.toggle('picked', li.dataset.channel === picked);
      li.setAttribute('aria-pressed', String(li.dataset.channel === picked));
    });
  }

  function markTiles() {
    tiles.forEach((tile, i) => {
      const s = latest?.slots[i];
      const loud = tile.classList.contains('loud');
      const marks = [];
      if (s?.pinned) marks.push(glyph('pin', PIN, 'Pinned'));
      if (loud) marks.push(glyph('sound', SPEAKER, 'Sound on'));
      tile.querySelector('.tile-marks').replaceChildren(...marks);
      const button = tile.querySelector('button');
      const who = s?.display_name || s?.channel || 'empty';
      button.setAttribute('aria-label', `Slot ${i + 1}: ${who}${s?.pinned ? ', pinned' : ''}`);
      button.setAttribute('aria-pressed', String(loud));
    });
  }

  rail.addEventListener('click', e => {
    const li = e.target.closest('li');
    if (li) pick(li.dataset.channel);
  });
  rail.addEventListener('keydown', e => {
    const li = e.target.closest('li');
    if (li && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pick(li.dataset.channel); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') pick(null); });

  const STRIKE = '<path d="M3 3l18 18"/>';

  function undo(kind, paths, label, body) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'undo ' + kind;
    button.title = label;
    button.setAttribute('aria-label', label);
    const on = glyph('on', paths, label);
    const off = glyph('off', paths + STRIKE, label);
    on.removeAttribute('role');
    off.removeAttribute('role');
    on.removeAttribute('aria-label');
    off.removeAttribute('aria-label');
    button.append(on, off);
    button.addEventListener('click', e => {
      e.stopPropagation();
      button.disabled = true;
      act(body).catch(() => { button.disabled = false; });
    });
    // Enter on the button must not also pick the row
    button.addEventListener('keydown', e => e.stopPropagation());
    return button;
  }

  function row(c) {
    const li = document.createElement('li');
    const img = document.createElement('img');
    img.alt = '';
    // Twitch refreshes previews every few minutes; the bucket keeps the browser cache in step
    if (c.thumbnail) img.src = c.thumbnail + '?t=' + Math.floor(Date.now() / 300000);
    const who = document.createElement('div');
    who.className = 'who';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = c.display_name || c.channel;
    const cat = document.createElement('span');
    cat.className = 'cat';
    const label = STATES.find(([s]) => s === c.state);
    // glyphs and row shading carry these states, so the line keeps to the category
    cat.textContent = ['live', 'in quad', 'benched'].includes(c.state) ? (c.category || '') : [label ? label[1] : c.state, c.category].filter(Boolean).join(' · ');
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.append(cat);
    if (c.viewers != null) {
      const viewers = document.createElement('span');
      viewers.className = 'viewers';
      viewers.textContent = compact.format(c.viewers);
      viewers.title = c.viewers.toLocaleString() + ' viewers';
      meta.append(viewers);
    }
    const line = document.createElement('div');
    line.className = 'line';
    line.append(name);
    const marks = [];
    if (c.slot != null) {
      const badge = document.createElement('span');
      badge.className = 'slot';
      badge.textContent = c.slot + 1;
      badge.title = 'On tile ' + (c.slot + 1);
      marks.push(badge);
    }
    const displayName = c.display_name || c.channel;
    if (c.pin_slot != null) {
      marks.push(undo('pin', PIN, 'Unpin ' + displayName + ' from slot ' + (c.pin_slot + 1),
        { action: 'unpin', slot: c.pin_slot }));
    }
    if (c.benched) {
      const holder = latest?.channels.find(x => x.channel === c.benched_for);
      const why = holder ? ' (benched for ' + (holder.display_name || holder.channel) + ')' : '';
      marks.push(undo('bench', BENCH, 'Unbench ' + displayName + why,
        { action: 'unbench', channel: c.channel }));
    }
    if (marks.length) {
      const box = document.createElement('span');
      box.className = 'marks';
      box.append(...marks);
      line.append(box);
    }
    li.classList.toggle('benched', c.benched);
    who.append(line, meta);
    li.dataset.channel = c.channel;
    li.classList.toggle('in', c.state === 'in quad');
    li.classList.toggle('picked', c.channel === picked);
    li.tabIndex = 0;
    li.setAttribute('role', 'button');
    li.setAttribute('aria-pressed', String(c.channel === picked));
    li.append(img, who);
    return li;
  }

  const ORDER = {
    priority: (a, b) => (b.priority ?? -Infinity) - (a.priority ?? -Infinity),
    viewers: (a, b) => (b.viewers ?? -1) - (a.viewers ?? -1),
    name: (a, b) => (a.display_name || a.channel).localeCompare(b.display_name || b.channel),
    newest: (a, b) => (b.started_at ?? -Infinity) - (a.started_at ?? -Infinity),
    longest: (a, b) => (a.started_at ?? Infinity) - (b.started_at ?? Infinity),
  };

  function render() {
    if (!latest) return;
    const q = view.q.trim().toLowerCase();
    const show = new Set(view.show);
    const cats = new Set(view.cats);
    const rows = latest.channels
      .filter(c => show.has(c.state))
      .filter(c => !cats.size || cats.has(c.category))
      .filter(c => !q || [c.display_name, c.channel, c.category, c.title]
        .some(v => v && v.toLowerCase().includes(q)))
      .sort(ORDER[view.sort] || ORDER.priority);
    rail.replaceChildren(...rows.map(row));
    document.querySelector('.filter-btn').classList.toggle('changed',
      cats.size > 0 || view.show.slice().sort().join() !== DEFAULTS.show.slice().sort().join());
    document.querySelector('.sort-btn').classList.toggle('changed', view.sort !== DEFAULTS.sort);
  }

  function option(type, name, value, text, checked, onChange) {
    const label = document.createElement('label');
    const input = document.createElement('input');
    input.type = type;
    input.name = name;
    input.value = value;
    input.checked = checked;
    input.addEventListener('change', onChange);
    const span = document.createElement('span');
    span.textContent = text;
    label.title = text;
    label.append(input, span);
    return label;
  }

  function fillFilters() {
    const show = document.querySelector('.filter-pop .show');
    show.replaceChildren(show.querySelector('legend'), ...STATES.map(([s, text]) =>
      option('checkbox', 'show', s, text, view.show.includes(s), e => {
        view.show = e.target.checked ? [...view.show, s] : view.show.filter(x => x !== s);
        save(); render();
      })));
    const live = latest ? [...new Set(latest.channels
      .filter(c => c.state !== 'offline' && c.category).map(c => c.category))].sort() : [];
    const cats = document.querySelector('.filter-pop .cats');
    cats.replaceChildren(cats.querySelector('legend'), ...live.map(name =>
      option('checkbox', 'cat', name, name, view.cats.includes(name), e => {
        view.cats = e.target.checked ? [...view.cats, name] : view.cats.filter(x => x !== name);
        save(); render();
      })));
  }

  function fillSorts() {
    const sorts = document.querySelector('.sort-pop .sorts');
    sorts.replaceChildren(sorts.querySelector('legend'), ...SORTS.map(([key, text]) =>
      option('radio', 'sort', key, text, view.sort === key, () => { view.sort = key; save(); render(); })));
  }

  function edge(pop) {
    pop.classList.toggle('more', pop.scrollTop + pop.clientHeight < pop.scrollHeight - 1);
  }
  document.querySelectorAll('.pop').forEach(pop => pop.addEventListener('scroll', () => edge(pop)));

  function toggle(button, pop, fill) {
    const open = pop.hidden;
    document.querySelectorAll('.pop').forEach(p => { p.hidden = true; });
    document.querySelectorAll('.tools button').forEach(b => b.setAttribute('aria-expanded', 'false'));
    if (open) {
      fill(); pop.hidden = false; pop.scrollTop = 0;
      button.setAttribute('aria-expanded', 'true'); edge(pop);
    }
  }
  const filterBtn = document.querySelector('.filter-btn');
  const sortBtn = document.querySelector('.sort-btn');
  filterBtn.addEventListener('click', () => toggle(filterBtn, document.querySelector('.filter-pop'), fillFilters));
  sortBtn.addEventListener('click', () => toggle(sortBtn, document.querySelector('.sort-pop'), fillSorts));
  function closePops() {
    document.querySelectorAll('.pop').forEach(p => { p.hidden = true; });
    document.querySelectorAll('.tools button').forEach(b => b.setAttribute('aria-expanded', 'false'));
  }
  document.addEventListener('click', e => { if (!e.target.closest('.pop, .tools button')) closePops(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePops(); });
  document.querySelector('.filter-pop .reset').addEventListener('click', () => {
    view.show = [...DEFAULTS.show]; view.cats = []; save(); fillFilters(); render();
  });
  document.querySelector('.sort-pop .reset').addEventListener('click', () => {
    view.sort = DEFAULTS.sort; save(); fillSorts(); render();
  });
  document.querySelector('.tools input').addEventListener('input', e => { view.q = e.target.value; render(); });

  // drag and drop on pointer events, so mouse, pen and touch share one path. a touch
  // drag starts on a long press, leaving a quick swipe to scroll the rail
  const DRAG_DISTANCE = 6;
  const LONG_PRESS = 300;
  const pending = new Map();
  let drag = null;
  let dragged = false;

  document.querySelector('.reset-all').addEventListener('click', () => act({ action: 'reset' }));

  async function act(body) {
    const resp = await fetch('/api/actions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-QuadLink-Token': token },
      body: JSON.stringify(body),
    });
    if (!resp.ok) throw new Error((await resp.json().catch(() => ({}))).error || resp.statusText);
  }

  function expect(slot, channel) {
    const tile = tiles[slot];
    tile.classList.remove('failed');
    tile.classList.add('pending');
    pending.set(slot, { channel });
  }

  function settle(slot, failed = false) {
    pending.delete(slot);
    tiles[slot].classList.remove('pending');
    if (failed) {
      tiles[slot].classList.add('failed');
      setTimeout(() => tiles[slot].classList.remove('failed'), 2000);
    }
  }

  function fail(slot) {
    uncover(tiles[slot]);
    settle(slot, true);
  }

  function tileUnder(x, y) {
    const el = document.elementFromPoint(x, y);
    return el ? el.closest('.tile') : null;
  }

  function start(e, source) {
    const ghost = document.createElement('div');
    ghost.className = 'ghost';
    const image = source.image();
    if (image) ghost.style.backgroundImage = 'url("' + image + '")';
    document.body.append(ghost);
    if (source.tile) source.tile.classList.add('lifted');
    drag = { ...drag, ghost, source, active: true };
    move(e);
  }

  function move(e) {
    drag.ghost.style.left = e.clientX + 'px';
    drag.ghost.style.top = e.clientY + 'px';
    const over = tileUnder(e.clientX, e.clientY);
    tiles.forEach(t => t.classList.toggle('target', t === over && t !== drag.source.tile));
  }

  function place(slot, channel, image) {
    expect(slot, channel);
    cover(tiles[slot], image);
    act({ action: 'place', channel, slot }).catch(() => fail(slot));
  }

  function end(e, cancelled) {
    const { source, ghost } = drag;
    ghost.remove();
    tiles.forEach(t => t.classList.remove('target', 'lifted'));
    const over = cancelled ? null : tileUnder(e.clientX, e.clientY);
    drag = null;
    if (!over) return;
    const slot = tiles.indexOf(over);
    if (source.channel !== undefined) {
      place(slot, source.channel, source.image());
    } else if (slot !== source.slot) {
      const a = source.slot, b = slot;
      const ca = latest?.slots[a]?.channel ?? null, cb = latest?.slots[b]?.channel ?? null;
      expect(a, cb);
      expect(b, ca);
      const fa = frame(tiles[a]), fb = frame(tiles[b]);
      cover(tiles[a], fb);
      cover(tiles[b], fa);
      act({ action: 'swap', a, b }).catch(() => { fail(a); fail(b); });
    }
  }

  document.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    if (drag.active) { move(e); return; }
    const far = Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > DRAG_DISTANCE;
    if (!far) return;
    // a touch that moves before the long press is a scroll, not a drag
    if (drag.touch) { clearTimeout(drag.timer); drag = null; return; }
    start(e, drag.pending());
  });
  document.addEventListener('pointerup', e => {
    if (!drag || e.pointerId !== drag.id) return;
    clearTimeout(drag.timer);
    if (drag.active) { dragged = true; end(e, false); } else drag = null;
  });
  document.addEventListener('pointercancel', e => {
    if (!drag || e.pointerId !== drag.id) return;
    clearTimeout(drag.timer);
    if (drag.active) end(e, true); else drag = null;
  });
  // once a touch drag starts, keep the page from scrolling under it
  document.addEventListener('touchmove', e => { if (drag && drag.active) e.preventDefault(); }, { passive: false });
  // the drop's pointerup also clicks the tile; that click must not toggle its sound
  document.addEventListener('click', e => { if (dragged) { dragged = false; e.stopPropagation(); e.preventDefault(); } }, true);

  rail.addEventListener('pointerdown', e => {
    const li = e.target.closest('li');
    if (!li || e.button !== 0 || drag) return;
    const img = li.querySelector('img');
    const source = () => ({ channel: li.dataset.channel, image: () => img && img.src });
    drag = { x: e.clientX, y: e.clientY, id: e.pointerId, active: false, touch: e.pointerType === 'touch', pending: source };
    if (drag.touch) drag.timer = setTimeout(() => { if (drag && !drag.active) start(e, source()); }, LONG_PRESS);
  });
  tiles.forEach((tile, slot) => tile.addEventListener('pointerdown', e => {
    if (e.button !== 0 || drag) return;
    const source = () => ({
      slot, tile,
      image: () => {
        const channel = latest?.slots[slot]?.channel;
        return channel ? '/api/slots/' + slot + '/still.jpg?c=' + encodeURIComponent(channel) : null;
      },
    });
    drag = { x: e.clientX, y: e.clientY, id: e.pointerId, active: false, touch: e.pointerType === 'touch', pending: source };
    if (drag.touch) drag.timer = setTimeout(() => { if (drag && !drag.active) start(e, source()); }, LONG_PRESS);
  }));

  const token = document.querySelector('meta[name="quadlink-token"]').content;
  const events = new EventSource('/api/events?token=' + encodeURIComponent(token));
  events.onmessage = e => { latest = JSON.parse(e.data); render(); markTiles(); };
  // a restart changes the page token, and EventSource never retries a refusal
  events.onerror = () => { if (events.readyState === EventSource.CLOSED) setTimeout(() => location.reload(), 5000); };
</script>
</body>
</html>
