<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="quadlink-token" content="__QUADLINK_TOKEN__">
<title>quadlink · quad</title>
<style>
  /* one corner radius for every rounded surface; nested corners subtract their inset */
  :root { --radius: 14px; }
  html, body { margin: 0; height: 100%; background: #000; color: #e7e9ee; }
  body { display: grid; grid-template: 48px 1fr / 260px 1fr; grid-template-areas: "top top" "rail quad"; }
  header { grid-area: top; border-bottom: 1px solid #1c2028; background: #0b0d11; }
  aside { grid-area: rail; border-right: 1px solid #1c2028; background: #0b0d11; overflow-y: auto; }
  .stage { grid-area: quad; min-width: 0; min-height: 0; container-type: size;
    display: flex; align-items: flex-start; justify-content: center; }
  /* the whole quad is 16:9, so each 16:9 stream fills its tile uncropped and the
     tiles touch. it takes 80% of the stage width when the height allows, and sits
     as far below the top bar as it is in from the sides (never past the bottom) */
  .quad { --w: min(80cqw, (100cqh - 20cqw) * 16 / 9);
    display: grid; grid-template: 1fr 1fr / 1fr 1fr;
    width: var(--w); aspect-ratio: 16 / 9;
    margin-top: min((100cqw - var(--w)) / 2, 100cqh - var(--w) * 9 / 16);
    border-radius: var(--radius); overflow: hidden; }
  .tile { position: relative; background: #0a0c10; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .tile button { all: unset; position: absolute; inset: 0; cursor: pointer; }
  .rail { list-style: none; margin: 0; padding: 8px; display: flex; flex-direction: column; gap: 4px;
    font: 13px system-ui, sans-serif; }
  .rail li { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: var(--radius); }
  .rail li:hover { background: #151922; }
  .rail img { flex: none; width: 80px; aspect-ratio: 16 / 9; border-radius: calc(var(--radius) - 6px);
    background: #0a0c10;
    object-fit: cover; }
  .rail .who { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .rail .name { font-weight: 600; }
  .rail .cat { color: #9aa3b2; font-size: 12px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  @media (max-width: 720px) {
    body { grid-template: 48px 1fr auto / 1fr; grid-template-areas: "top" "quad" "rail"; }
    aside { border-right: 0; border-top: 1px solid #1c2028; min-height: 120px; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
</head>
<body>
<header></header>
<aside aria-label="Online streamers"><ul class="rail"></ul></aside>
<main class="stage">
<div class="quad">
  <div class="tile">
    <video muted autoplay playsinline></video>
    <button aria-label="Unmute slot 1"></button>
  </div>
  <div class="tile">
    <video muted autoplay playsinline></video>
    <button aria-label="Unmute slot 2"></button>
  </div>
  <div class="tile">
    <video muted autoplay playsinline></video>
    <button aria-label="Unmute slot 3"></button>
  </div>
  <div class="tile">
    <video muted autoplay playsinline></video>
    <button aria-label="Unmute slot 4"></button>
  </div>
</div>
</main>
<script>
  const tiles = [...document.querySelectorAll('.tile')];

  function play(video, src) {
    // native first: iOS Safari has HLS built in but no MSE, so hls.js can't run there
    if (video.canPlayType('application/vnd.apple.mpegurl') || !window.Hls || !Hls.isSupported()) {
      video.src = src;
      const retry = () => setTimeout(() => play(video, src), 3000);
      video.addEventListener('error', retry, { once: true });
      return;
    }
    const hls = new Hls({ liveSyncDurationCount: 3 });
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (!data.fatal) return;
      hls.destroy();
      setTimeout(() => play(video, src), 3000);
    });
    hls.loadSource(src);
    hls.attachMedia(video);
  }

  tiles.forEach((tile, i) => {
    const video = tile.querySelector('video');
    play(video, '/streams/' + (i + 1));
    // one tile has sound at a time; click the loud one again to mute it
    tile.querySelector('button').addEventListener('click', () => {
      const loud = !tile.classList.contains('loud');
      tiles.forEach(t => { t.classList.remove('loud'); t.querySelector('video').muted = true; });
      if (loud) { tile.classList.add('loud'); video.muted = false; video.play(); }
    });
  });

  const rail = document.querySelector('.rail');
  const SHOWN = new Set(['live', 'waiting']);

  function row(c) {
    const li = document.createElement('li');
    const img = document.createElement('img');
    img.alt = '';
    // Twitch refreshes previews every few minutes; the bucket keeps the browser cache in step
    if (c.thumbnail) img.src = c.thumbnail + '?t=' + Math.floor(Date.now() / 300000);
    const who = document.createElement('div');
    who.className = 'who';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = c.display_name || c.channel;
    const cat = document.createElement('span');
    cat.className = 'cat';
    cat.textContent = c.category || '';
    who.append(name, cat);
    li.append(img, who);
    return li;
  }

  function render(state) {
    const online = state.channels
      .filter(c => SHOWN.has(c.state))
      .sort((a, b) => (b.priority ?? 0) - (a.priority ?? 0));
    rail.replaceChildren(...online.map(row));
  }

  const token = document.querySelector('meta[name="quadlink-token"]').content;
  const events = new EventSource('/api/events?token=' + encodeURIComponent(token));
  events.onmessage = e => render(JSON.parse(e.data));
  // a restart changes the page token, and EventSource never retries a refusal
  events.onerror = () => { if (events.readyState === EventSource.CLOSED) setTimeout(() => location.reload(), 5000); };
</script>
</body>
</html>
