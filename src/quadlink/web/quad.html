<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- a round tile, so the Q reads on light and dark browser chrome alike; the Q's nail
     is shorter than the logo's to hold up at 16px. An icon cannot read the
     page's tokens: the tile is --twitch, the Q --white -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2232%22 fill=%22%239147ff%22/%3E%3Cg fill=%22%23ffffff%22 transform=%22translate%280 -3%29%22%3E%3Cpath d=%22M39.53 12.39A21 21 0 1 1 24.47 12.39L25.55 15.19A14.65 14.65 0 1 0 38.45 15.19Z%22/%3E%3Cpath d=%22M24.5 31H39.5L37 35.5H35.4L34.3 54L32 59L29.7 54L28.6 35.5H27Z%22/%3E%3C/g%3E%3C/svg%3E">

<title>quadlink · quad</title>
<style>
  /* one corner radius for every rounded surface; nested corners subtract their inset.
     every color is a token here, and every purple is mixed from --twitch */
  :root {
    --radius: 17px;
    --twitch: #9147ff;
    --black: #000;
    --white: #fff;
    --clear: transparent;
    --ground: color-mix(in oklab, var(--twitch) 22%, var(--black));
    --hover: color-mix(in oklab, var(--twitch) 36%, var(--black));
    --current: color-mix(in oklab, var(--twitch) 29%, var(--black));
    --tile-hover: color-mix(in oklab, var(--white) 45%, var(--clear));
    --drop-wash: color-mix(in oklab, var(--twitch) 22%, var(--clear));
    --well: var(--black);
    --scrim: color-mix(in oklab, var(--black) 65%, var(--clear));
    --text: color-mix(in oklab, var(--twitch) 6%, var(--white));
    --text-quiet: color-mix(in oklab, var(--twitch) 35%, var(--white));
    --accent: var(--twitch);
    --field: color-mix(in oklab, var(--twitch) 30%, var(--black));
    --popover: color-mix(in oklab, var(--twitch) 32%, var(--black));
    --live: #eb0400;
    --error: var(--live);
    --logo: var(--twitch);
  }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--text); }
  body { display: grid; grid-template: 58px 1fr / 312px 1fr; grid-template-areas: "rail top" "rail quad"; }
  header { grid-area: top; display: flex; align-items: center; justify-content: space-between;
    padding: 0 19px; font: 16px system-ui, sans-serif; }
  .logo { display: flex; align-items: center; }
  .logo svg { width: 143.4px; height: 24.7px; }
  .explore-btn { height: 34px; padding: 0 14px 0 11px; border: 0; border-radius: calc(var(--radius) - 7px);
    background: var(--field); color: var(--text); font: inherit; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px; }
  .explore-btn:hover { background: var(--hover); }
  aside { grid-area: rail; min-height: 0; display: flex; flex-direction: column;
    font: 16px system-ui, sans-serif; position: relative; }
  .tools { display: flex; gap: 7px; padding: 10px 10px 5px; }
  .tools input { flex: 1; min-width: 0; height: 38px; box-sizing: border-box; padding: 0 12px;
    border: 0; border-radius: calc(var(--radius) - 7px); background: var(--field);
    color: var(--text); font: inherit; outline-offset: 0; }
  .tools input::placeholder { color: var(--text-quiet); }
  .tools button { position: relative; flex: none; width: 38px; height: 38px; border: 0;
    border-radius: calc(var(--radius) - 7px); background: var(--field); color: var(--text);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .tools button:hover, .tools button[aria-expanded="true"] { background: var(--hover); }
  .add { padding-top: 0; }
  .add .busy-glyph, .add.busy .idle-glyph { display: none; }
  .add.busy .busy-glyph { display: block; }
  /* the tiles' pending pulse, drawn as an edge so the text stays solid */
  .add.busy input, .add.busy button { cursor: progress;
    box-shadow: inset 0 0 0 2px var(--accent); animation: edge 1s infinite alternate; }
  .add input.bad { outline: 2px solid var(--error); }
  @keyframes edge { to { box-shadow: inset 0 0 0 2px var(--clear); } }
  .add-error { margin: 0 10px 6px; color: var(--error); font-size: 14px; }
  .add-error[hidden] { display: none; }
  /* added channels sit above the configured ones, under their own label */
  .rail .section { padding: 6px 7px 0; color: var(--text-quiet); font-size: 14px; cursor: default; }
  .rail .section.gap { height: 6px; padding: 0; }
  /* a dot on a glyph says its choices differ from the defaults */
  .tools button.changed::after { content: ""; position: absolute; top: 6px; right: 6px;
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  /* the gutter keeps room for the scrollbar even when it shows, so the reset glyph
     at the row's right end never sits under it */
  .pop { position: absolute; top: 53px; left: 10px; right: 10px; z-index: 1;
    border-radius: var(--radius); background: var(--popover); max-height: 60vh;
    overflow-y: auto; scrollbar-gutter: stable; }
  .pop-head { display: flex; align-items: center; justify-content: space-between;
    padding: 7px 7px 0 12px; color: var(--text-quiet); font-size: 14px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap; }
  .pop-body { padding: 0 12px 7px; }
  .pop fieldset:last-child { margin-bottom: 0; }
  /* the fade shows only while more options sit below, so the menu ends at its last item */
  .pop.more::after { content: ""; position: sticky; bottom: 0; display: block; height: 38px;
    margin-top: -32px; pointer-events: none;
    background: linear-gradient(var(--clear), var(--popover)); }
  .pop .reset { width: 34px; height: 34px; border: 0; padding: 0;
    border-radius: calc(var(--radius) - 7px); background: none; color: var(--text-quiet);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .pop .reset:hover { background: var(--hover); color: var(--text); }
  /* fieldsets default to min-content width, which would let long names push past the edge */
  .pop fieldset { border: 0; margin: 0 0 10px; padding: 0; min-width: 0; }
  .pop legend { color: var(--text-quiet); font-size: 14px; margin-bottom: 5px; padding: 0; }
  .pop label { display: flex; align-items: center; gap: 10px; padding: 5px 2px; cursor: pointer;
    min-width: 0; }
  .pop label span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pop input { accent-color: var(--accent); }
  .rail-scroll { flex: 1; min-height: 0; overflow-y: auto; }
  .stage { grid-area: quad; min-width: 0; min-height: 0; container-type: size;
    display: flex; flex-direction: column; align-items: center; }
  /* the quad as four cards, the size of Explore's: a live tile, then name and category.
     7px wider each side, the cards' inset, so their content lines up with Explore */
  .quad { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;
    width: calc(92cqw + 14px); margin-top: 5px; flex: none; font: 16px system-ui, sans-serif; }
  .tile { position: relative; aspect-ratio: 16 / 9; border-radius: calc(var(--radius) - 7px);
    background: var(--well); overflow: hidden; }
  /* first among the outline rules: pending and failure outrank a plain hover */
  .tile:hover::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 2px var(--tile-hover); }
  video { width: 100%; height: 100%; object-fit: contain; display: block; }
  /* stands in for the incoming channel until the player reaches the splice */
  .cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    background: var(--well); pointer-events: none; opacity: 0; transition: opacity 0.8s; }
  .cover.shown { opacity: 1; transition: none; }
  .tile button { all: unset; position: absolute; inset: 0; cursor: pointer; }
  .tile button:focus-visible { outline: 3px solid var(--text); outline-offset: -3px; }
  body.picking .tile button { cursor: copy; }
  body.picking .tile:hover::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 3px var(--accent); }
  /* the rail's chips, on a scrim so they read over any video; clicks pass to the tile */
  .tile-marks { position: absolute; z-index: 1; top: 10px; left: 10px; display: flex; gap: 5px;
    pointer-events: none; }
  .tile-marks .chip { background: var(--scrim); color: var(--text); }
  .rail { list-style: none; margin: 0; padding: 5px 10px 10px; display: flex; flex-direction: column;
    gap: 5px; }
  .rail li { display: flex; align-items: center; gap: 12px; padding: 7px; border-radius: var(--radius); }
  .rail li:hover { background: var(--hover); }
  .rail img { flex: none; width: 96px; aspect-ratio: 16 / 9; border-radius: calc(var(--radius) - 7px);
    background: var(--well);
    object-fit: cover; }
  .rail .who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .rail .name, .rail .cat { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rail .name { font-weight: 600; }
  /* override glyphs follow the name; the name gives way first */
  .rail .line { display: flex; align-items: center; gap: 7px; min-width: 0; }
  /* every glyph sits at the line's end, so the name keeps the rest of the row */
  .rail .marks { flex: none; margin-left: auto; display: inline-flex; align-items: center; gap: 5px;
    color: var(--text-quiet); }
  /* WCAG 2.5.8: a 29px hit area around a 16px glyph */
  /* one chip for everything a row carries: facts (viewers, slot) and actions (put back,
     remove); only colour and behaviour differ */
  .chip { flex: none; display: inline-flex; align-items: center; justify-content: center;
    gap: 5px; height: 22px; min-width: 22px; padding: 0 6px; margin: 0; box-sizing: border-box;
    border: 1.5px solid var(--clear); border-radius: calc(var(--radius) - 9px);
    background: none; color: var(--text-quiet); font: 600 13px/1 system-ui, sans-serif;
    font-variant-numeric: tabular-nums; }
  .chip svg { width: 13px; height: 13px; }
  /* filled: the tile it is on; hollow (back): the tile a drop put it off */
  .chip.slot { border-color: var(--accent); background: var(--accent); color: var(--white); }
  .chip.back { border-color: var(--accent); color: var(--text); }
  /* every viewer count on the page: a small live dot, then the compact number */
  .viewers { flex: none; display: inline-flex; align-items: center; gap: 4px; color: var(--text-quiet);
    font-weight: 400; font-variant-numeric: tabular-nums; }
  .viewers:empty { display: none; }
  .viewers::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--live); }
  /* red on hover says a click takes it away */
  button.chip { cursor: pointer; appearance: none; }
  button.chip:hover, button.chip:focus-visible { border-color: var(--error);
    color: var(--error); background: var(--popover); }
  button.chip:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
  /* put back restores, so it lights up in the accent rather than the red of removal */
  button.chip.back:hover, button.chip.back:focus-visible {
    border-color: var(--accent); color: var(--white); background: var(--accent); }
  button.chip.back:disabled { border-color: var(--clear); color: var(--text-quiet);
    background: none; cursor: default; }
  /* WCAG 1.4.1: a state needs more than color, and the in-quad tint is only 1.05:1 */
  .rail li:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; }
  /* a picked row waits for a tile click: the click alternative to dragging */
  .rail li.picked { box-shadow: inset 0 0 0 2px var(--accent); }
  .rail li.replaced > img, .rail li.replaced .line .name { opacity: 0.55; }
  /* category and viewer count share the second line; the category gives way first */
  .rail .meta { display: flex; align-items: center; gap: 10px; color: var(--text-quiet); font-size: 14px; }
  .rail .cat { flex: 1; min-width: 0; }
  /* drag: rows and tiles can be picked up; long-press callouts would steal touch drags */
  .rail li, .tile { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
  .rail li { cursor: grab; }
  .rail img { pointer-events: none; }
  /* an offline channel has no preview; an empty well reads as a broken image */
  .rail img:not([src]) { background: var(--field); }
  .explore-btn[aria-pressed="true"] { background: var(--current); color: var(--text); }
  .explore-btn[aria-pressed="true"] svg { color: var(--accent); }
  /* the Explore button switches the phone's one list; desktop shows the rail and Explore */
  @media (min-width: 721px) { .explore-btn { display: none; } }
  .explore { flex: 1; min-height: 0; width: 92cqw; display: flex; flex-direction: column;
    position: relative; font: 16px system-ui, sans-serif; }
  /* the rail's menu width, under the buttons that open it */
  .explore .pop { left: auto; right: 7px; width: min(320px, 100%); }
  .explore[hidden] { display: none; }
  @media (min-width: 721px) { .explore[hidden] { display: flex; } }
  .explore .tools { padding: 16px 0 7px; }
  /* the gaps grow so every row, the last too, is flush at both edges */
  .explore-cats { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 5px; padding: 0 0 16px; }
  .explore-cats .chip-row { flex-basis: 100%; display: flex; flex-wrap: wrap; justify-content: space-between;
    gap: 5px; min-width: 0; }
  /* category chips choose, so they light up in the accent rather than the red of removal */
  .explore-cats .chip { color: var(--text); background: var(--current); }
  .explore-cats .chip span:first-child { font-weight: 400; }
  .explore-cats button.chip:hover, .explore-cats button.chip:focus-visible {
    border-color: var(--clear); color: var(--text); background: var(--hover); }
  .explore-cats .chip[aria-pressed="true"] { border-color: var(--accent);
    background: var(--accent); color: var(--white); }
  .explore-cats .chip[aria-pressed="true"] .viewers { color: var(--white); }
  .explore-note { margin: 0; padding: 4px 7px; color: var(--text-quiet); font-size: 14px; }
  .explore-note:empty { display: none; }
  /* 7px wider each side, the cards' inset, so their content lines up with the quad.
     the whole of Explore scrolls, its tools too, and fades out under the quad; menus
     anchor here so they scroll with the buttons that open them */
  .explore-scroll { flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; margin: 0 -7px; padding: 0 7px;
    position: relative; }
  /* the fade shows once cards sit above, as the menus' fade shows while options sit below.
     a mask, not an overlay: iOS Safari lets scrolling text show through a sticky overlay */
  :is(.explore-scroll, .rail-scroll).under { -webkit-mask-image: linear-gradient(var(--clear), var(--black) 48px);
    mask-image: linear-gradient(var(--clear), var(--black) 48px); }
  .cards { list-style: none; margin: 0 -7px; padding: 0 0 10px; min-width: 0; display: grid; gap: 16px 12px;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .card { display: flex; flex-direction: column; gap: 6px; padding: 7px; border-radius: var(--radius);
    cursor: grab; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
  .card:hover { background: var(--hover); }
  .card:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; }
  .card.picked { box-shadow: inset 0 0 0 2px var(--accent); }
  .card .pic { position: relative; aspect-ratio: 16 / 9; border-radius: calc(var(--radius) - 7px);
    overflow: hidden; background: var(--well); }
  .card .pic img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .card .pic .chip { position: absolute; background: var(--scrim); color: var(--text); }
  .card .pic .act { right: 6px; top: 6px; }
  .card .pic .chip.slot { background: var(--accent); color: var(--white); }
  .card .pic button.chip.back:hover, .card .pic button.chip.back:focus-visible { background: var(--accent); }
  .card .line { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .card .line .viewers { margin-left: auto; font-size: 14px; }
  .card .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .cat { margin-top: -4px; color: var(--text-quiet); font-size: 14px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  /* a quad card's category opens it in Explore */
  .quad-card .cat .what { cursor: pointer; }
  .quad-card .cat .what:hover, .quad-card .cat .what:focus-visible { color: var(--text); outline: none; }
  /* the title is opt-in: a cleaned copy fades in over the picture on hover, focus or
     a pick, so the grid never shifts */
  .card .peek { display: flex; position: absolute; inset: 0; align-items: flex-end;
    padding: 34px 10px 36px; box-sizing: border-box; background: var(--scrim); color: var(--text);
    font-size: 14px; line-height: 1.35; opacity: 0; pointer-events: none; transition: opacity 0.12s;
    overflow: hidden; overflow-wrap: anywhere; }
  .card:is(:hover, :focus-visible, :has(:focus-visible), .picked) .peek { opacity: 1; }
  .card .pic .chip { z-index: 1; }
  /* the add chip waits for the pointer; slot and back chips always show */
  @media (hover: hover) {
    .card .pic .act:not(.slot):not(.back) { opacity: 0; transition: opacity 0.12s; }
    .card:is(:hover, :focus-visible, :has(:focus-visible), .picked) .pic .act { opacity: 1; }
  }
  .card.skeleton { cursor: default; }
  .card.skeleton .pic { animation: pulse 1s infinite alternate; }
  .card.skeleton .bar { height: 14px; border-radius: 7px; background: var(--field); }
  .explore-end { margin: 0; padding: 4px 7px 16px; color: var(--text-quiet); font-size: 14px; }
  .explore-end:empty { display: none; }
  .ghost { position: fixed; z-index: 10; left: 0; top: 0; width: 144px; aspect-ratio: 16 / 9;
    border-radius: calc(var(--radius) - 7px); background: var(--well) center / cover no-repeat;
    box-shadow: 0 0 0 2px var(--accent); pointer-events: none; opacity: 0.9;
    transform: translate(-50%, -50%); }
  .tile.target::after, .tile.pending::after, .tile.failed::after { content: ""; position: absolute;
    inset: 0; pointer-events: none; }
  /* outlines take the tile's corners */
  .tile::after { border-radius: inherit; }
  .tile.target::after { box-shadow: inset 0 0 0 4px var(--accent); background: var(--drop-wash); }
  .tile.pending::after { box-shadow: inset 0 0 0 3px var(--accent); animation: pulse 1s infinite alternate; }
  .tile.failed::after { box-shadow: inset 0 0 0 3px var(--error); }
  .tile.lifted { opacity: 0.5; }
  @keyframes pulse { to { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) {
    .tile.pending::after, .add.busy input, .add.busy button, .card.skeleton .pic { animation: none; }
    .cover, .card .peek, .card .pic .act { transition: none; }
  }
  /* phones: top bar, the quad as 2x2 cards, then the rail or Explore */
  @media (max-width: 720px) {
    body { grid-template: 58px auto minmax(0, 1fr) / minmax(0, 1fr); grid-template-areas: "top" "quad" "rail"; }
    .stage { display: contents; }
    .quad { grid-area: quad; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 4px;
      width: auto; margin: 0 12px; }
    aside { padding-top: 10px; }
    body.exploring aside { display: none; }
    .explore { grid-area: rail; width: auto; padding: 10px 10px 0; }
    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    /* phones keep the chips to one row that scrolls sideways */
    .explore-cats { flex-wrap: nowrap; overflow-x: auto; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>

<script>
  const tiles = [...document.querySelectorAll('.tile')];

  // the relay marks every splice with a DISCONTINUITY, which hls.js counts in frag.cc;
  // the native player exposes no such hook, so its cover lifts on a timer
  const COVER_NATIVE = 7000;
  const COVER_MAX = 20000;

  function play(video, src, tile) {
    // native first: iOS Safari has HLS built in but no MSE, so hls.js can't run there
    if (video.canPlayType('application/vnd.apple.mpegurl') || !window.Hls || !Hls.isSupported()) {
      video.src = src;
      const retry = () => setTimeout(() => play(video, src, tile), 3000);
      video.addEventListener('error', retry, { once: true });
      return;
    }
    tile.hls = true;
    const hls = new Hls({ liveSyncDurationCount: 2 });
    hls.on(Hls.Events.FRAG_CHANGED, (_, { frag }) => {
      if (tile.cc !== undefined && frag.cc !== tile.cc && tile.awaiting) uncover(tile);
      tile.cc = frag.cc;
    });
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (!data.fatal) return;
      hls.destroy();
      tile.cc = undefined;
      setTimeout(() => play(video, src, tile), 3000);
    });
    hls.loadSource(src);
    hls.attachMedia(video);
  }

  // a slot the server changed (selection, an unpin) shows the incoming channel's
  // thumbnail until its video plays, like a drop does
  function coverChanges(before) {
    tiles.forEach((tile, i) => {
      const channel = latest.slots[i]?.channel;
      if (!channel || channel === before.slots[i]?.channel || tile.awaiting) return;
      cover(tile, thumb(channel));
    });
  }

  // Twitch refreshes previews every few minutes; the bucket keeps the browser cache in step
  function thumb(channel) {
    const c = latest?.channels.find(x => x.channel === channel);
    return c?.thumbnail ? c.thumbnail + '?t=' + Math.floor(Date.now() / 300000) : null;
  }

  function cover(tile, image) {
    const img = tile.querySelector('.cover');
    clearTimeout(tile.coverTimer);
    if (image) img.src = image; else img.removeAttribute('src');
    img.classList.add('shown');
    tile.awaiting = true;
    tile.coverTimer = setTimeout(() => uncover(tile), tile.hls ? COVER_MAX : COVER_NATIVE);
  }

  function uncover(tile) {
    clearTimeout(tile.coverTimer);
    tile.awaiting = false;
    tile.querySelector('.cover').classList.remove('shown');
    settle(tiles.indexOf(tile));
  }

  // the current frame as an image; the relay is same-origin, so the canvas stays readable
  function frame(tile) {
    const video = tile.querySelector('video');
    if (!video.videoWidth) return null;
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    return canvas.toDataURL('image/jpeg', 0.8);
  }

  tiles.forEach((tile, i) => {
    const video = tile.querySelector('video');
    play(video, '/streams/' + (i + 1), tile);
    // one tile has sound at a time; click the loud one again to mute it. with a row
    // picked, the click places that channel instead
    tile.querySelector('button').addEventListener('click', () => {
      if (picked) {
        const el = document.querySelector(`[data-channel="${CSS.escape(picked)}"] img`);
        place(i, picked, el?.src || null);
        pick(null);
        return;
      }
      const loud = !tile.classList.contains('loud');
      tiles.forEach(t => { t.classList.remove('loud'); t.querySelector('video').muted = true; });
      if (loud) { tile.classList.add('loud'); video.muted = false; video.play(); }
      markTiles();
    });
  });

  const rail = document.querySelector('.rail');
  // the one formatter for every viewer count, so the rail, chips and cards agree
  const viewerFormat = new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 0 });
  function viewerCount(n) {
    const span = document.createElement('span');
    span.className = 'viewers';
    if (n != null) span.textContent = viewerFormat.format(n).toLowerCase();
    return span;
  }
  const STATES = [['live', 'Live'], ['waiting', 'Waiting'], ['replaced', 'Replaced'],
                  ['offline', 'Offline']];
  const SORTS = [['priority', 'Priority'], ['viewers', 'Viewers'], ['name', 'Name'],
                 ['newest', 'Newest stream'], ['longest', 'Longest stream']];
  const DEFAULTS = { show: ['live', 'waiting', 'replaced'], cats: [], sort: 'priority' };
  let view = { ...DEFAULTS, q: '' };
  try { Object.assign(view, JSON.parse(localStorage.getItem('quadlink.view.3') || '{}'), { q: '' }); } catch {}
  let latest = null;

  function save() {
    try { localStorage.setItem('quadlink.view.3', JSON.stringify({ show: view.show, cats: view.cats, sort: view.sort })); } catch {}
  }

  function glyph(kind, paths, label) {
    const span = document.createElement('span');
    span.className = kind;
    span.title = label;
    span.setAttribute('role', 'img');
    span.setAttribute('aria-label', label);
    span.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
      + 'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>';
    return span;
  }

  const SPEAKER = '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>'
    + '<path d="M18.5 5.5a9 9 0 0 1 0 13"/>';
  let picked = null;

  function pick(channel) {
    picked = channel && channel !== picked ? channel : null;
    document.body.classList.toggle('picking', picked !== null);
    document.querySelectorAll('.rail li, .cards .card[data-channel]').forEach(el => {
      el.classList.toggle('picked', el.dataset.channel === picked);
      el.setAttribute('aria-pressed', String(el.dataset.channel === picked));
    });
  }

  function markTiles() {
    tiles.forEach((tile, i) => {
      const s = latest?.slots[i];
      const loud = tile.classList.contains('loud');
      const marks = [];
      if (s?.reserved_for) {
        const offline = document.createElement('span');
        offline.className = 'chip';
        offline.textContent = 'Offline';
        marks.push(offline);
      }
      if (loud) marks.push(glyph('chip', SPEAKER, 'Sound on'));
      tile.querySelector('.tile-marks').replaceChildren(...marks);
      const info = tile.parentElement;
      info.querySelector('.name').textContent = s?.display_name || s?.channel || '';
      info.querySelector('.viewers')?.remove();
      if (s?.viewers != null) info.querySelector('.line').append(viewerCount(s.viewers));
      const what = info.querySelector('.what');
      what.textContent = s?.category || '';
      what.hidden = !s?.category;
      const button = tile.querySelector('button');
      const who = s?.display_name || s?.channel || 'empty';
      button.setAttribute('aria-label', `Slot ${i + 1}: ${who}${s?.pinned ? ', pinned' : ''}`);
      button.setAttribute('aria-pressed', String(loud));
    });
  }

  document.querySelectorAll('.quad-card .what').forEach(b => {
    const open = () => { setExploring(true); chooseNamed(b.textContent); };
    b.addEventListener('click', open);
    b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
  });

  rail.addEventListener('click', e => {
    const li = e.target.closest('li[data-channel]');
    if (li) pick(li.dataset.channel);
  });
  rail.addEventListener('keydown', e => {
    const li = e.target.closest('li[data-channel]');
    if (li && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pick(li.dataset.channel); }
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (picked) pick(null);
    else if (exploring() && phone.matches) setExploring(false);
  });

  function nameOf(channel) {
    const c = latest?.channels.find(x => x.channel === channel);
    return c ? c.display_name || c.channel : channel;
  }

  function backButton(c, displayName) {
    const tile = c.replaced_slot + 1;
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'chip back';
    button.textContent = tile;
    button.title = 'Replaced by ' + nameOf(c.replaced_by);
    button.setAttribute('aria-label', `Put ${displayName} back on tile ${tile}`);
    // offline, it would only put filler on the tile
    button.disabled = !c.live;
    const target = tiles[c.replaced_slot];
    const show = on => target.classList.toggle('target', on && !button.disabled);
    button.addEventListener('mouseenter', () => show(true));
    button.addEventListener('mouseleave', () => show(false));
    button.addEventListener('focus', () => show(true));
    button.addEventListener('blur', () => show(false));
    button.addEventListener('pointerdown', e => e.stopPropagation());
    button.addEventListener('click', e => {
      e.stopPropagation();
      show(false);
      button.disabled = true;
      back(c.replaced_slot, c.channel);
      act({ action: 'put_back', channel: c.channel })
        .catch(() => { button.disabled = false; fail(c.replaced_slot); });
    });
    button.addEventListener('keydown', e => e.stopPropagation());
    return button;
  }

  function section(text, gap = false) {
    const li = document.createElement('li');
    li.className = gap ? 'section gap' : 'section';
    li.textContent = text;
    li.setAttribute('role', 'presentation');
    return li;
  }

  const CROSS = '<path d="M6 6l12 12M18 6L6 18"/>';

  function removeButton(c) {
    const label = 'Remove ' + (c.display_name || c.channel);
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'chip remove';
    button.title = label;
    button.setAttribute('aria-label', label);
    const mark = glyph('on', CROSS, label);
    mark.removeAttribute('role');
    mark.removeAttribute('aria-label');
    button.append(mark);
    button.addEventListener('click', e => {
      e.stopPropagation();
      button.disabled = true;
      act({ action: 'remove', channel: c.channel }).catch(() => { button.disabled = false; });
    });
    button.addEventListener('keydown', e => e.stopPropagation());
    return button;
  }

  const addForm = document.querySelector('.add');
  const addInput = addForm.querySelector('input');
  const addButton = addForm.querySelector('button');
  const addError = document.querySelector('.add-error');
  const addStatus = document.querySelector('aside [role="status"]');
  // the name and duplicate checks answer at once; only the Twitch lookup shows as busy
  const BUSY_AFTER = 150;
  // the server gives up on a lookup after about 10 s
  const ROW_WAIT = 10000;
  let adding = false;
  let added = null;
  function addFailed(message) {
    addInput.classList.toggle('bad', Boolean(message));
    addError.textContent = message || '';
    addError.hidden = !message;
    if (message) {
      addInput.setAttribute('aria-invalid', 'true');
      addInput.setAttribute('aria-describedby', 'add-error');
    } else {
      addInput.removeAttribute('aria-invalid');
      addInput.removeAttribute('aria-describedby');
    }
  }
  function busy(channel) {
    addForm.classList.toggle('busy', Boolean(channel));
    addForm.setAttribute('aria-busy', String(Boolean(channel)));
    addButton.setAttribute('aria-disabled', String(Boolean(channel)));
    addButton.setAttribute('aria-label', channel ? 'Adding ' + channel : 'Add channel');
    addInput.readOnly = Boolean(channel);
  }
  addInput.addEventListener('input', () => addFailed(null));
  addForm.addEventListener('submit', async e => {
    e.preventDefault();
    const channel = addInput.value.trim().toLowerCase();
    if (!channel || adding) return;
    adding = true;
    const timer = setTimeout(() => busy(channel), BUSY_AFTER);
    try {
      await act({ action: 'add', channel });
      addInput.value = '';
      addFailed(null);
      added = { channel, until: Date.now() + ROW_WAIT, seen: null };
      showAdded();
    } catch (err) {
      addFailed(err.message);
      addInput.select();
    } finally {
      clearTimeout(timer);
      busy(null);
      adding = false;
    }
  });

  // the snapshot with the new row can land before or after the action's answer
  function showAdded() {
    if (!added || added.seen) return;
    if (Date.now() > added.until) { added = null; return; }
    const li = [...rail.children].find(x => x.dataset.channel === added.channel);
    if (!li) return;
    added.seen = Date.now();
    li.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth' });
    addStatus.textContent = 'Added ' + (li.querySelector('.name')?.textContent || added.channel);
  }

  function row(c) {
    const li = document.createElement('li');
    const img = document.createElement('img');
    img.alt = '';
    const image = thumb(c.channel);
    if (image) img.src = image;
    const who = document.createElement('div');
    who.className = 'who';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = c.display_name || c.channel;
    const cat = document.createElement('span');
    cat.className = 'cat';
    const label = STATES.find(([s]) => s === c.state);
    // glyphs and row shading carry these states, so the line keeps to the category
    cat.textContent = ['live', 'in quad', 'replaced'].includes(c.state) ? (c.category || '') : [label ? label[1] : c.state, c.category].filter(Boolean).join(' · ');
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.append(cat);
    if (c.viewers != null) meta.append(viewerCount(c.viewers));
    const line = document.createElement('div');
    line.className = 'line';
    line.append(name);
    const marks = [];
    const displayName = c.display_name || c.channel;
    if (c.replaced_slot != null) marks.push(backButton(c, displayName));
    if (c.extra) marks.push(removeButton(c));
    if (c.slot != null) {
      const badge = document.createElement('span');
      badge.className = 'chip slot';
      badge.textContent = c.slot + 1;
      badge.title = 'Slot ' + (c.slot + 1);
      marks.push(badge);
    }
    if (marks.length) {
      const box = document.createElement('span');
      box.className = 'marks';
      box.append(...marks);
      line.append(box);
    }
    li.classList.toggle('replaced', c.replaced_slot != null);
    who.append(line, meta);
    li.dataset.channel = c.channel;
    li.classList.toggle('picked', c.channel === picked);
    li.tabIndex = 0;
    li.setAttribute('role', 'button');
    li.setAttribute('aria-pressed', String(c.channel === picked));
    li.append(img, who);
    return li;
  }

  const ORDER = {
    priority: (a, b) => (b.priority ?? -Infinity) - (a.priority ?? -Infinity),
    viewers: (a, b) => (b.viewers ?? -1) - (a.viewers ?? -1),
    name: (a, b) => (a.display_name || a.channel).localeCompare(b.display_name || b.channel),
    newest: (a, b) => (b.started_at ?? -Infinity) - (a.started_at ?? -Infinity),
    longest: (a, b) => (a.started_at ?? Infinity) - (b.started_at ?? Infinity),
  };

  const stage = document.querySelector('.stage');
  const aside = document.querySelector('aside');
  const explore = document.querySelector('.explore');
  const exploring = () => document.body.classList.contains('exploring');
  const phone = matchMedia('(max-width: 720px)');
  function render() {
    if (!latest) return;
    const q = view.q.trim().toLowerCase();
    const show = new Set(view.show);
    const cats = new Set(view.cats);
    const matches = c => !q || [c.display_name, c.channel, c.category, c.title]
      .some(v => v && v.toLowerCase().includes(q));
    // what drops put off the quad, by tile, whatever the filters
    const replaced = latest.channels.filter(c => c.replaced_slot != null && c.slot == null && matches(c))
      .sort((a, b) => a.replaced_slot - b.replaced_slot);
    // added channels show whatever their state: they are on the list only by choice
    const added = latest.channels.filter(c => c.extra && c.slot == null && matches(c))
      .sort(ORDER.name);
    const rows = latest.channels
      .filter(c => !c.extra && c.slot == null && c.replaced_slot == null && c.state !== 'in quad')
      .filter(c => show.has(c.state))
      .filter(c => !cats.size || cats.has(c.category))
      .filter(matches)
      .sort(ORDER[view.sort] || ORDER.priority);
    // the quad's channels are its cards, not rows
    const head = [];
    if (replaced.length) {
      head.push(section('Replaced'), ...replaced.map(row));
    }
    if (added.length) {
      head.push(section('Added'), ...added.map(row));
    }
    if (head.length && rows.length) head.push(section('', true));
    rail.replaceChildren(...head, ...rows.map(row));
    document.querySelector('.filter-btn').classList.toggle('changed',
      cats.size > 0 || view.show.slice().sort().join() !== DEFAULTS.show.slice().sort().join());
    document.querySelector('.sort-btn').classList.toggle('changed', view.sort !== DEFAULTS.sort);
  }

  function option(type, name, value, text, checked, onChange) {
    const label = document.createElement('label');
    const input = document.createElement('input');
    input.type = type;
    input.name = name;
    input.value = value;
    input.checked = checked;
    input.addEventListener('change', onChange);
    const span = document.createElement('span');
    span.textContent = text;
    label.title = text;

    li.tabIndex = 0;
    li.setAttribute('aria-pressed', String(s.channel === picked));
    li.classList.toggle('picked', s.channel === picked);
    const pic = document.createElement('div');
    pic.className = 'pic';
    const img = document.createElement('img');
    img.alt = '';
    img.loading = 'lazy';
    // Twitch refreshes previews every few minutes; each opening of Explore gets fresh ones
    if (s.thumbnail) img.src = s.thumbnail + '?t=' + ex.opened;
    const viewers = viewerCount(s.viewers);
    const peek = document.createElement('div');
    peek.className = 'peek';
    peek.textContent = cleanTitle(s.title);
    pic.append(img, peek, action(s));
    const line = document.createElement('div');
    line.className = 'line';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = s.display_name;
    line.append(name);
    // the viewer's own language goes without saying
    if (s.language && s.language.toLowerCase() !== own?.language) {
      const lang = document.createElement('span');
      lang.className = 'chip';
      lang.textContent = flag(s.language) || s.language;
      lang.title = languageName(s.language);
      line.append(lang);
    }
    line.append(viewers);
    // the category sits under the name, as on the rail's rows
    const cat = document.createElement('div');
    cat.className = 'cat';
    cat.textContent = s.category;
    li.append(pic, line, cat);
    return li;
  }

  // one chip: + to add, hourglass while adding, × once added, the tile number on the quad
  function action(s) {
    const v = viewOf(s.channel);
    const name = s.display_name;
    let el;
    if (v?.slot != null) {
      el = document.createElement('span');
      el.className = 'chip slot';
      el.textContent = v.slot + 1;
      el.title = 'Slot ' + (v.slot + 1);
    } else if (ex.adding.has(s.channel)) {
      el = document.createElement('span');
      el.className = 'chip';
      el.setAttribute('role', 'img');
      el.setAttribute('aria-label', 'Adding ' + name);
      el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + HOURGLASS + '</svg>';
    } else if (ex.failed.has(s.channel)) {
      el = document.createElement('span');
      el.className = 'chip';
      el.textContent = 'Offline';
      el.title = ex.failed.get(s.channel);
    } else if (v?.extra) {
      el = removeButton({ channel: s.channel, display_name: name });
    } else if (v) {
      return document.createTextNode('');
    } else {
      el = document.createElement('button');
      el.type = 'button';
      el.className = 'chip back';
      el.title = 'Add ' + name;
      el.setAttribute('aria-label', 'Add ' + name);
      el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">' + PLUS + '</svg>';
      el.addEventListener('click', async e => {
        e.stopPropagation();
        ex.adding.add(s.channel);
        markCards();
        try {
          await act({ action: 'add', channel: s.channel });
          lastAdded = s.channel;
        } catch (err) {
          ex.failed.set(s.channel, err.message);
        } finally {
          ex.adding.delete(s.channel);
          markCards();
        }
      });
      el.addEventListener('keydown', e => e.stopPropagation());
    }
    el.classList.add('act');
    el.addEventListener('pointerdown', e => e.stopPropagation());
    return el;
  }

  function markCards() {
    if (!exploring() || !ex.listing) return;
    const byChannel = new Map(ex.listing.streams.map(s => [s.channel, s]));
    cards.querySelectorAll('.card[data-channel]').forEach(li => {
      const s = byChannel.get(li.dataset.channel);
      if (!s) return;
      li.querySelector('.act')?.replaceWith(action(s));
    });
  }

  cards.addEventListener('click', e => {
    const li = e.target.closest('.card[data-channel]');
    if (li && !e.target.closest('button')) pick(li.dataset.channel);
  });
  cards.addEventListener('keydown', e => {
    const li = e.target.closest('.card[data-channel]');
    if (li && e.target === li && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pick(li.dataset.channel); }
  });
  if (!phone.matches || location.hash === '#explore') setExploring(true);
  phone.addEventListener('change', () => { if (!phone.matches) setExploring(true); });

  const events = new EventSource('/api/events?token=' + encodeURIComponent(token));
  events.onmessage = e => {
    const before = latest;
    latest = JSON.parse(e.data);
    render();
    markTiles();
    markCards();
    showAdded();
    if (before) coverChanges(before);
  };
  // a restart changes the page token, and EventSource never retries a refusal
  events.onerror = () => { if (events.readyState === EventSource.CLOSED) setTimeout(() => location.reload(), 5000); };
</script>
</body>
</html>
