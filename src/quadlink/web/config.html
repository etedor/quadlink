<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2232%22 fill=%22%239147ff%22/%3E%3Cg fill=%22%23ffffff%22 transform=%22translate%280 -3%29%22%3E%3Cpath d=%22M39.53 12.39A21 21 0 1 1 24.47 12.39L25.55 15.19A14.65 14.65 0 1 0 38.45 15.19Z%22/%3E%3Cpath d=%22M24.5 31H39.5L37 35.5H35.4L34.3 54L32 59L29.7 54L28.6 35.5H27Z%22/%3E%3C/g%3E%3C/svg%3E">
<meta name="quadlink-token" content="__QUADLINK_TOKEN__">
<title>quadlink · config</title>
<link rel="stylesheet" href="/web/base.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/lib/codemirror.css">
<style>
  /* every syntax tone keeps 4.5:1 on either wash */
  :root { --error-wash: color-mix(in oklab, var(--error) 30%, var(--raised));
    --select-wash: color-mix(in oklab, var(--accent-fill) 30%, var(--raised));
    /* the dashboard's header insets, as gutters: panel text starts where the logo does, and
       the panels end where the Quad button does */
    --gutter-l: max(var(--inset), 4% - var(--edge));
    --gutter-r: max(var(--edge), 4% - var(--inset));
    --mono: var(--t-meta)/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
  /* beside the rail the dashboard's header spans the window less --rail, so the Quad button
     takes its right inset from that width and stays where the dashboard's gear is */
  @media (min-width: 721px) {
    :root { --gutter-r: max(var(--edge), (100vw - var(--rail)) * 0.04 - var(--inset)); }
  }
  /* the dashboard's header: as tall as its tools row, on the same insets */
  header { display: flex; align-items: center; justify-content: space-between;
    height: calc(var(--control) + 2 * var(--edge));
    padding: 0 var(--gutter-r) 0 calc(var(--gutter-l) + var(--edge)); }
  .logo { display: flex; align-items: center; }
  /* the wordmark's own proportions */
  .logo svg { width: 143.4px; height: 24.7px; }
  main { display: grid; gap: var(--edge); padding: 0 var(--gutter-r) 0 var(--gutter-l); }
  .col { display: grid; gap: var(--edge); min-width: 0; min-height: 0; }
  /* each editor scrolls inside its panel, so the panel needs a definite height */
  .panel { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 60dvh;
    box-sizing: border-box; padding: var(--edge); border-radius: var(--r-outer); background: var(--raised); }
  .panel.short { height: 40dvh; }
  /* wide screens fit the viewport: the columns fill what the header and the bar leave, end on
     one line, and the page never scrolls. Settings gets a band sized for its few keys; Rulesets takes the rest */
  @media (min-width: 1000px) {
    body { display: flex; flex-direction: column; height: 100dvh; }
    main { flex: 1; min-height: 0; grid-template: minmax(0, 1fr) / minmax(0, 3fr) minmax(0, 2fr); }
    .col { grid-template-rows: minmax(0, 1fr) clamp(200px, 45%, 360px); }
    .panel, .panel.short { height: auto; }
  }
  /* the editor's own focus is only its caret */
  .panel:has(.CodeMirror-focused) { outline: var(--focus) solid var(--text); }
  .head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: var(--s2);
    min-height: var(--control); margin-bottom: var(--s2); }
  /* the dashboard's name weight, so section titles stand above the quiet labels */
  h2 { margin: 0; font-size: var(--t-body); font-weight: 600; color: var(--text); }
  .head label { display: flex; align-items: center; gap: var(--s2); font-size: var(--t-meta);
    color: var(--text-quiet); }
  /* a field on a panel takes the next level up, or it vanishes into the panel */
  .head select { background: var(--overlay); color: var(--text); }
  /* shows only when CodeMirror fails to load */
  textarea.field { flex: 1; min-height: 0; width: 100%; padding: var(--edge);
    background: var(--overlay); font: var(--mono); resize: none; }
  /* fills the panel under its heading; its scroller sizes from this flexed height */
  .CodeMirror { flex: 1 1 0; min-height: 0; height: auto; background: var(--raised); color: var(--text); font: var(--mono); }
  .CodeMirror-gutters { border: 0; background: var(--raised); }
  .CodeMirror-linenumber { padding: 0 var(--s2) 0 0; color: var(--text-quiet); }
  .CodeMirror-cursor { border-left-color: var(--text); }
  .CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected { background: var(--select-wash); }
  .cm-s-ql .cm-atom { color: var(--accent-ink); }
  .cm-s-ql :is(.cm-number, .cm-keyword, .cm-def, .cm-variable-2) { color: var(--text); }
  .cm-s-ql :is(.cm-string, .cm-meta, .cm-comment) { color: var(--text-quiet); }
  .cm-s-ql .cm-comment { font-style: italic; }
  /* the edge mark carries the line for anyone who cannot tell the wash from the panel */
  .ql-error { background: var(--error-wash); box-shadow: inset var(--ring) 0 var(--error); }
  /* on phones the bar stays in reach while the page scrolls */
  .actions { position: sticky; bottom: 0; flex: none; display: flex; align-items: center; gap: var(--s2);
    padding: var(--edge) var(--gutter-r) var(--edge) var(--gutter-l); background: var(--ground); }
  .actions output { min-width: 0; margin-inline-end: auto; font-size: var(--t-meta); color: var(--text-quiet); }
  .actions output.error { color: var(--error-ink); }
  .actions .btn { position: relative; flex: none; }
  /* the dashboard's dot for choices that differ: here, edits not yet saved */
  .btn.changed::after { content: ""; position: absolute; top: var(--s1); right: var(--s1);
    width: var(--s2); height: var(--s2); border-radius: var(--r-pill); background: var(--accent-ink); }
  footer { flex: none; display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); padding: 0 var(--gutter-r) var(--edge) var(--gutter-l);
    font-size: var(--t-meta); color: var(--text-quiet); overflow-wrap: anywhere; }
</style>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/lib/codemirror.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/mode/yaml/yaml.js"></script>
</head>
<body>
<header>
  <a class="logo" href="/quad" aria-label="QuadLink">
    <svg viewBox="0 0 143.37 24.72" aria-hidden="true">
      <g style="fill: var(--accent-fill)">
        <g transform="scale(0.3863)">
        <path d="M39.53 12.39A21 21 0 1 1 24.47 12.39L25.55 15.19A14.03 14.03 0 1 0 38.45 15.19Z"/>
        <path d="M24.58 30.5H39.42L36.80 35H35.35L34.13 57L32 63.5L29.87 57L28.65 35H27.20Z"/>
        </g>
        <path d="M24.92 16.02V4.25H28.82V16.02Q28.82 17.12 29.54 17.54Q30.25 17.95 32 17.95Q33.72 17.95 34.41 17.54Q35.1 17.12 35.1 16.02V4.25H39V16.02Q39 20.72 31.95 20.72Q24.92 20.72 24.92 16.02Z M48.25 4.25H53L58.85 20.47H54.9L53.45 16.2H47.52L46.1 20.47H42.25ZM52.6 13.6 50.55 7.5H50.45L48.4 13.6Z M62.15 4.25H69.05Q71.9 4.25 73.55 4.69Q75.2 5.12 75.97 6.2Q76.75 7.27 76.75 9.17V15.77Q76.75 17.62 76.02 18.64Q75.3 19.65 73.65 20.06Q72 20.47 69.07 20.47H62.15ZM68.9 17.7Q70.5 17.7 71.31 17.56Q72.12 17.42 72.49 17.02Q72.85 16.62 72.85 15.77V9.1Q72.85 7.95 71.94 7.49Q71.02 7.02 69.02 7.02H66.05V17.7Z M81.4 4.25H85.3V17.7H93.27V20.47H81.4Z M97.4 4.25H101.3V20.47H97.4Z M106.3 4.25H110.25L118.1 15.32V4.25H121.57V20.47H117.62L109.77 9.22V20.47H106.3Z M126.57 4.25H130.47V20.47H126.57ZM130.57 11.87 136.65 4.25H141.22L135.07 11.8L141.9 20.47H137.15Z"/>
      </g>
    </svg>
  </a>
  <a class="btn icon" href="/quad" aria-label="Quad" data-icon="quad"></a>
</header>

<main>
<section class="panel">
  <div class="head">
    <h2 id="title-priorities">Priorities</h2>
    <label>Sort by
      <select id="sort-order" class="field" onchange="loadConfig()">
        <option value="desc">High to low</option>
        <option value="asc">Low to high</option>
      </select>
    </label>
  </div>
  <textarea id="editor-priorities" class="field" aria-labelledby="title-priorities" spellcheck="false" placeholder="Loading…"></textarea>
</section>

<div class="col">
<section class="panel">
  <div class="head"><h2 id="title-rulesets">Rulesets</h2></div>
  <textarea id="editor-rulesets" class="field" aria-labelledby="title-rulesets" spellcheck="false" placeholder="Loading…"></textarea>
</section>

<section class="panel short">
  <div class="head"><h2 id="title-settings">Settings</h2></div>
  <textarea id="editor-settings" class="field" aria-labelledby="title-settings" spellcheck="false" placeholder="Loading…"></textarea>
</section>
</div>
</main>

<div class="actions">
  <output id="status"></output>
  <button type="button" class="btn" onclick="loadConfig()">Reload</button>
  <button type="button" class="btn" onclick="validateConfig()">Validate</button>
  <button type="button" class="btn" id="save" onclick="saveConfig()">Save</button>
</div>

<footer>
  <span id="version"></span>
  <span id="config-path">Loading…</span>
</footer>

<script>
  const status = document.getElementById('status');
  const configPath = document.getElementById('config-path');
  const versionEl = document.getElementById('version');
  const saveBtn = document.getElementById('save');
  let initialized = false;
  const token = document.querySelector('meta[name="quadlink-token"]').content;

  function api(url, options = {}) {
    const headers = {'X-QuadLink-Token': token};
    if (options.body !== undefined) headers['Content-Type'] = 'application/json';
    return fetch(url, {...options, headers, cache: 'no-store'});
  }

  // Lucide 1.61.0 (ISC, lucide.dev), on its 24-unit 2px stroke grid, as on the dashboard
  const ICONS = {
    quad: '<rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>',
  };
  document.querySelectorAll('[data-icon]').forEach(el => {
    const t = document.createElement('template');
    t.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '
      + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[el.dataset.icon] + '</svg>';
    el.prepend(t.content.firstChild);
  });

  const sections = {
    priorities: ['priorities'],
    rulesets: ['rulesets'],
    settings: ['diversity_bonus', 'stability_bonus', 'category_continuity_bonus', 'pin_bonus',
               'webhook', 'proxy_playlist', 'low_latency', 'lookup_timeout',
               'relay_segments', 'log_level']
  };
  const names = ['priorities', 'rulesets', 'settings'];

  // the textareas stay the source of truth: each editor writes back through save(). without
  // CodeMirror (CDN down) the page edits the plain textareas
  const editors = {};
  for (const name of names) {
    const ta = document.getElementById('editor-' + name);
    if (!window.CodeMirror) { ta.addEventListener('input', onEdit); continue; }
    const cm = CodeMirror.fromTextArea(ta, {
      mode: 'yaml', theme: 'ql', lineNumbers: true, lineWrapping: true,
      screenReaderLabel: document.getElementById('title-' + name).textContent,
      // YAML forbids tab characters, and Tab keeps moving focus as it did in the textarea
      extraKeys: {Tab: false, 'Shift-Tab': false},
    });
    cm.on('change', onEdit);
    editors[name] = cm;
  }

  function getText(name) {
    editors[name]?.save();
    return document.getElementById('editor-' + name).value;
  }

  function setText(name, value) {
    if (editors[name]) editors[name].setValue(value);
    document.getElementById('editor-' + name).value = value;
  }

  // what the editors held at the last load or save; the Save dot shows any difference
  let baseline = {};
  function markSaved() {
    for (const name of names) baseline[name] = getText(name);
    saveBtn.classList.remove('changed');
  }

  function onEdit() {
    clearErrorLines();
    saveBtn.classList.toggle('changed', names.some(n => getText(n) !== baseline[n]));
  }

  // merged line index -> [section, editor line], built by the last mergeYamlSections()
  let lineMap = [];
  let errorLines = [];

  function clearErrorLines() {
    for (const [cm, handle] of errorLines) cm.removeLineClass(handle, 'background', 'ql-error');
    errorLines = [];
  }

  // YAML errors mark "line N, column M" in the merged document: the construct it was in, then
  // where the parser gave up, often the line after the mistake, so both get the wash. schema
  // errors name a key path, not a line, and stay in the status only
  function showErrorLine(message) {
    if (!lineMap.length) return;
    for (const [, n] of message.matchAll(/line (\d+), column/g)) {
      const [name, line] = lineMap[Math.min(Number(n), lineMap.length) - 1];
      const cm = editors[name];
      if (!cm) continue;
      if (!errorLines.length) {
        cm.getWrapperElement().closest('.panel').scrollIntoView({block: 'center'});
        cm.scrollIntoView({line, ch: 0}, cm.getScrollInfo().clientHeight / 3);
      }
      errorLines.push([cm, cm.addLineClass(line, 'background', 'ql-error')]);
    }
  }

  function showStatus(message, isError = false) {
    status.textContent = message;
    status.className = isError ? 'error' : '';
    if (!isError) {
      setTimeout(() => {
        if (status.textContent === message) status.textContent = '';
      }, 3000);
    }
  }

  function splitYamlSections(yaml) {
    const lines = yaml.split('\n');
    const result = { priorities: [], rulesets: [], settings: [] };
    let currentSection = null;

    for (const line of lines) {
      const keyMatch = line.match(/^(\w+):/);
      if (keyMatch) {
        const key = keyMatch[1];
        if (sections.priorities.includes(key)) {
          currentSection = 'priorities';
          continue;
        } else if (sections.rulesets.includes(key)) {
          currentSection = 'rulesets';
          continue;
        } else {
          currentSection = 'settings';
        }
      }
      if (currentSection) {
        const nested = currentSection === 'priorities' || currentSection === 'rulesets';
        if (nested && line.startsWith('  ')) {
          result[currentSection].push(line.slice(2));
        } else {
          result[currentSection].push(line);
        }
      }
    }

    return {
      priorities: result.priorities.join('\n').trim(),
      rulesets: result.rulesets.join('\n').trim(),
      settings: result.settings.join('\n').trim()
    };
  }

  function mergeYamlSections() {
    const parts = [];
    lineMap = [];

    for (const name of names) {
      const raw = getText(name);
      const body = raw.trim();
      if (!body) continue;
      // trim() drops leading blank lines, which shifts the editor's numbering
      const lead = (raw.match(/^\s*/)[0].match(/\n/g) || []).length;
      const lines = body.split('\n');
      // the blank line between parts
      if (parts.length) lineMap.push(lineMap[lineMap.length - 1]);
      if (name === 'settings') {
        parts.push(body);
      } else {
        lineMap.push([name, lead]);
        parts.push(name + ':\n' + lines.map(l => '  ' + l).join('\n'));
      }
      lines.forEach((_, i) => lineMap.push([name, lead + i]));
    }

    return parts.join('\n\n');
  }

  async function loadConfig() {
    try {
      const sortOrder = document.getElementById('sort-order').value;
      const res = await api(`/api/config?t=${Date.now()}&sort=${sortOrder}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      configPath.textContent = data.path || 'Unknown';
      if (data.version) versionEl.textContent = 'v' + data.version;

      const split = splitYamlSections(data.yaml);
      for (const name of names) setText(name, split[name]);
      clearErrorLines();
      markSaved();

      if (initialized) showStatus('Reloaded');
      initialized = true;
    } catch (e) {
      showStatus('Load failed: ' + e.message, true);
    }
  }

  async function validateConfig() {
    clearErrorLines();
    try {
      const yaml = mergeYamlSections();
      const res = await api('/api/validate', {
        method: 'POST',
        body: JSON.stringify({yaml})
      });
      const data = await res.json();
      if (data.valid) {
        showStatus('Valid');
      } else {
        showStatus(data.error, true);
        showErrorLine(data.error);
      }
    } catch (e) {
      showStatus(e.message, true);
    }
  }

  async function saveConfig() {
    clearErrorLines();
    try {
      const yaml = mergeYamlSections();
      const res = await api('/api/config', {
        method: 'POST',
        body: JSON.stringify({yaml})
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      markSaved();
      showStatus('Saved');
    } catch (e) {
      showStatus('Save failed: ' + e.message, true);
      showErrorLine(e.message);
    }
  }

  loadConfig();
</script>
</body>
</html>
